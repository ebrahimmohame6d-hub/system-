<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#6366f1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة المناديب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f8; --surface:#ffffff; --surface2:#f4f6fc; --ink:#1b2140; --muted:#5b6485; --line:#e3e7f3;
  --p1:#4f46e5; --p2:#7c3aed; --bad:#ef4444;
  --shadow:0 4px 18px rgba(79,70,229,.08);
}
[data-theme="dark"]{
  --bg:#0d1125; --surface:#161b37; --surface2:#1d2346; --ink:#f1f3ff; --muted:#b4bde3; --line:#2a3160;
  --shadow:0 4px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);transition:background .3s,color .3s}
header{
  display:flex;align-items:center;justify-content:space-between;padding:16px 20px;color:#fff;
  background:linear-gradient(120deg,#4f46e5,#7c3aed,#0ea5e9);background-size:300% 300%;
  box-shadow:0 6px 24px rgba(79,70,229,.3);animation:shimmer 10s ease infinite;
}
header h1{margin:0;font-size:21px;font-weight:800;animation:fadeUp .5s both}
.hbtn{
  height:40px;padding:0 14px;border-radius:12px;border:0;cursor:pointer;background:rgba(255,255,255,.2);
  color:#fff;font-family:inherit;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;
  transition:transform .2s,background .2s;
}
.hbtn:hover{transform:translateY(-2px);background:rgba(255,255,255,.32)}
.theme{width:40px;padding:0;justify-content:center;font-size:18px}
.theme.spin{animation:spinOnce .6s ease}

.wrap{max-width:1040px;margin:20px auto;padding:0 14px;display:flex;gap:16px;align-items:flex-start}
main.content{flex:1;min-width:0;max-width:760px}
.side{
  width:200px;flex-shrink:0;position:sticky;top:16px;display:flex;flex-direction:column;gap:8px;
  padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
  animation:fadeUp .5s both;
}
.side-title{font-weight:800;color:var(--muted);font-size:13px;padding:0 4px 4px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;border:0;cursor:pointer;
  color:var(--ink);text-decoration:none;font-family:inherit;font-weight:800;font-size:15px;text-align:right;
  background:var(--surface2);transition:transform .2s,background .2s,box-shadow .2s;
}
.nav-item:hover{transform:translateX(-4px);background:linear-gradient(90deg,rgba(79,70,229,.14),rgba(124,58,237,.05))}
.nav-item.on{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;box-shadow:0 8px 20px rgba(79,70,229,.3)}
.nav-item .ni{font-size:18px;display:inline-block;animation:floatY 3s ease-in-out infinite}
.nav-item.hl{background:linear-gradient(135deg,#fbbf24,#f97316);color:#fff;animation:glow 2s ease-in-out infinite}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
  margin-bottom:16px;padding:18px;animation:fadeUp .45s both;transition:transform .25s,box-shadow .25s;
}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(79,70,229,.14)}
.card:nth-child(1){animation-delay:.05s}
.card:nth-child(2){animation-delay:.15s}
.card:nth-child(3){animation-delay:.25s}
h2{margin:0 0 12px;font-size:18px;font-weight:800;color:var(--ink)}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
input{
  width:100%;padding:11px 12px;font-size:15px;font-family:inherit;color:var(--ink);
  border:1.5px solid var(--line);border-radius:12px;background:var(--surface2);outline:none;
  transition:border-color .25s,background .25s,box-shadow .25s,transform .2s;
}
input:focus{border-color:var(--p1);background:var(--surface);transform:translateY(-1px);box-shadow:0 0 0 4px rgba(79,70,229,.15)}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}

/* القايمة المنسدلة */
.dd{position:relative;width:100%}
.dd-btn{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:11px 14px;font-family:inherit;font-size:15px;font-weight:700;color:var(--ink);text-align:right;
  background:var(--surface2);border:1.5px solid var(--line);border-radius:14px;cursor:pointer;
  transition:border-color .25s,box-shadow .25s,background .25s,transform .2s;
}
.dd-btn:hover{border-color:#a5b4fc;box-shadow:0 6px 16px rgba(79,70,229,.12);transform:translateY(-1px)}
.dd.open .dd-btn{border-color:var(--p1);background:var(--surface);box-shadow:0 0 0 4px rgba(79,70,229,.15)}
.dd.empty .dd-label{color:var(--muted);font-weight:600}
.dd-chev{
  width:26px;height:26px;flex-shrink:0;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;font-size:13px;
  transition:transform .35s cubic-bezier(.2,.9,.3,1.2);
}
.dd.open .dd-chev{transform:rotate(180deg)}
.dd-menu{
  position:absolute;top:calc(100% + 6px);right:0;left:0;z-index:50;max-height:280px;overflow-y:auto;
  padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 18px 40px rgba(31,27,75,.22);
  opacity:0;transform:translateY(-8px) scale(.97);transform-origin:top center;pointer-events:none;
  transition:opacity .2s ease,transform .25s cubic-bezier(.2,.9,.3,1.2);
}
.dd.open .dd-menu{opacity:1;transform:none;pointer-events:auto}
.dd-item{
  padding:10px 12px;border-radius:10px;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;
  transition:background .2s,padding .2s,color .2s;
}
.dd-item:hover{background:linear-gradient(90deg,rgba(79,70,229,.14),rgba(124,58,237,.05));padding-right:18px}
.dd-item.sel{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.dd-item.placeholder{color:var(--muted);font-weight:600}
.dd.open .dd-item{animation:ddIn .35s both;animation-delay:calc(var(--k) * 35ms)}
@keyframes ddIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}

.formrow{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:end}
.btn{
  padding:12px 18px;border:0;border-radius:14px;cursor:pointer;font-family:inherit;font-size:15px;font-weight:700;
  color:#fff;background:linear-gradient(135deg,var(--p1),var(--p2));white-space:nowrap;
  transition:transform .2s,box-shadow .2s,filter .2s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(79,70,229,.35);filter:brightness(1.06)}
.btn:active{transform:scale(.97)}
.btn.danger{background:linear-gradient(135deg,#dc2626,#f97316)}
.btn.danger:hover{box-shadow:0 10px 22px rgba(220,38,38,.35)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}
.btn.full{width:100%;margin-top:12px}
.list{list-style:none;margin:0;padding:0}
.list li{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 6px;border-bottom:1px solid var(--line);font-weight:700;
  animation:slideIn .4s both;transition:background .2s,padding .2s;border-radius:10px;
}
.list li:hover{background:rgba(79,70,229,.06);padding-right:12px}
.list li:last-child{border-bottom:0}
.list li:nth-child(1){animation-delay:.05s}
.list li:nth-child(2){animation-delay:.1s}
.list li:nth-child(3){animation-delay:.15s}
.list li:nth-child(4){animation-delay:.2s}
.list li:nth-child(5){animation-delay:.25s}
.list li:nth-child(6){animation-delay:.3s}
.list li:nth-child(7){animation-delay:.35s}
.list li:nth-child(8){animation-delay:.4s}
.list li:nth-child(9){animation-delay:.45s}
.rep-name{font-size:16px;font-weight:700;letter-spacing:.2px}
.rate{
  font-size:13px;font-weight:700;color:#fff;background:linear-gradient(135deg,#6366f1,#a855f7);
  padding:5px 12px;border-radius:999px;white-space:nowrap;transition:transform .2s;
}
.rate:hover{transform:scale(1.06)}
.muted{color:var(--muted);font-size:14px;font-weight:700}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;width:min(92vw,420px);display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:12px 14px;border-radius:12px;color:#fff;font-weight:700;font-size:14px;box-shadow:0 10px 24px rgba(0,0,0,.25);animation:toastIn .4s cubic-bezier(.2,.9,.3,1.2)}
.toast.ok{background:linear-gradient(135deg,#059669,#10b981)}
.toast.err{background:linear-gradient(135deg,#dc2626,#f97316)}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 0 3px rgba(255,255,255,.35),0 6px 18px rgba(249,115,22,.45)}50%{box-shadow:0 0 0 6px rgba(255,255,255,.15),0 10px 30px rgba(249,115,22,.85)}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes shimmer{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes spinOnce{to{transform:rotate(360deg)}}

@media(max-width:760px){
  .wrap{flex-direction:column;margin-top:12px}
  main.content{max-width:none;width:100%}
  .side{width:100%;position:static;flex-direction:row;flex-wrap:wrap;padding:10px}
  .side-title{display:none}
  .nav-item{flex:1 1 auto;justify-content:center;padding:10px 8px;font-size:14px}
  .nav-item:hover{transform:none}
}
@media(max-width:560px){
  .formrow{grid-template-columns:1fr}
  .formrow .btn{width:100%}
}

/* ===================== Redesign layer (shared) ===================== */
:root{
  --bg:#f3f1fb; --surface:rgba(255,255,255,.82); --surface2:#f5f3ff; --ink:#1e1b3a; --muted:#6b6894; --line:#e6e2f7;
  --p1:#6366f1; --p2:#8b5cf6; --p3:#06b6d4; --pink:#ec4899; --ok:#10b981; --bad:#f43f5e;
  --shadow:0 8px 30px rgba(99,102,241,.10);
  --radius:22px;
}
[data-theme="dark"]{
  --bg:#0b0d1f; --surface:rgba(24,27,58,.78); --surface2:#1e2250; --ink:#f4f3ff; --muted:#aeb3de; --line:#2c3270;
  --shadow:0 10px 34px rgba(0,0,0,.45);
}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  background:
    radial-gradient(900px 500px at 90% -10%,rgba(139,92,246,.22),transparent 60%),
    radial-gradient(700px 480px at -10% 20%,rgba(6,182,212,.18),transparent 60%),
    radial-gradient(800px 500px at 60% 110%,rgba(236,72,153,.14),transparent 60%),
    var(--bg);
  background-attachment:fixed;
  animation:pageIn .5s ease both;
}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
body.leaving{opacity:0;transform:translateY(-6px);transition:opacity .22s,transform .22s}
::selection{background:rgba(139,92,246,.35)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--p1),var(--p2));border-radius:10px;border:2px solid transparent;background-clip:padding-box}

/* header */
header{
  position:sticky;top:0;z-index:60;padding:14px 22px;
  background:linear-gradient(120deg,#4f46e5,#7c3aed,#0ea5e9,#7c3aed);background-size:300% 300%;
  border-radius:0 0 26px 26px;box-shadow:0 12px 34px rgba(99,102,241,.35);
}
header h1{font-size:22px;letter-spacing:.2px;text-shadow:0 2px 10px rgba(0,0,0,.18)}
.hbtn{background:rgba(255,255,255,.22);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.28)}
.theme:hover{transform:translateY(-2px) rotate(18deg)}

/* layout */
.wrap{max-width:1120px;gap:20px;margin-top:22px}
main.content{max-width:780px}

/* sidebar */
.side{
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:var(--radius);padding:16px;gap:10px;
  top:92px;
}
.side-title{letter-spacing:.5px}
.nav-item{position:relative;border-radius:16px;overflow:hidden;background:transparent;border:1px solid transparent}
.nav-item:hover{transform:translateX(-5px);background:linear-gradient(90deg,rgba(99,102,241,.16),rgba(139,92,246,.04));border-color:var(--line)}
.nav-item.on,.nav-item.hl.on{
  background:linear-gradient(135deg,var(--p1),var(--p2) 60%,var(--pink));color:#fff;animation:none;
  box-shadow:0 10px 24px rgba(99,102,241,.38);
}
.nav-item.hl:not(.on){background:transparent;color:var(--ink);animation:none}
.nav-item .ni{animation:none;transition:transform .3s}
.nav-item:hover .ni{transform:scale(1.25) rotate(-8deg)}
.nav-item.on .ni{animation:floatY 3s ease-in-out infinite}

/* cards */
.content > .card,.card{
  background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  animation:fadeUp .55s cubic-bezier(.2,.8,.2,1) both;
}
.content > .card:nth-child(1){animation-delay:.04s}
.content > .card:nth-child(2){animation-delay:.10s}
.content > .card:nth-child(3){animation-delay:.16s}
.content > .card:nth-child(4){animation-delay:.22s}
.card:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(99,102,241,.18)}
.card.open{border-color:rgba(99,102,241,.45)}
.sec,h2{background:linear-gradient(90deg,var(--ink),var(--p1));-webkit-background-clip:text;background-clip:text}
.sec::before{width:6px;height:22px;background:linear-gradient(var(--p1),var(--pink));box-shadow:0 0 14px rgba(139,92,246,.6)}

/* inputs */
input,select{border-radius:14px;background:var(--surface2);border:1.5px solid var(--line)}
input:focus{border-color:var(--p2);box-shadow:0 0 0 4px rgba(139,92,246,.2)}
label{letter-spacing:.2px}

/* buttons */
.navbtn,.btn,.savebar button,.dd-addbtn{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--p1),var(--p2) 60%,var(--pink));background-size:160% 160%;
  box-shadow:0 8px 20px rgba(99,102,241,.32);transition:transform .2s,filter .2s,box-shadow .25s,background-position .5s;
}
.navbtn:hover,.btn:hover,.savebar button:hover{background-position:100% 50%;transform:translateY(-3px);box-shadow:0 14px 28px rgba(139,92,246,.42)}
.btn.danger{background:linear-gradient(135deg,#e11d48,#f97316)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(3.2);opacity:0}}
.seg{border-radius:14px;background:var(--surface2)}
.seg button{border-radius:11px;transition:background .25s,color .25s,transform .2s,box-shadow .25s}
.seg button.on{background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:0 6px 16px rgba(99,102,241,.4)}

/* dropdown */
.dd-btn{border-radius:14px}
.dd-menu{border-radius:16px;backdrop-filter:blur(14px);background:var(--surface)}
.dd-item.sel{background:linear-gradient(135deg,var(--p1),var(--p2))}

/* rep cards (index) */
.rate{background:linear-gradient(135deg,var(--p3),var(--p1) 60%,var(--p2));box-shadow:0 4px 12px rgba(6,182,212,.35)}
.arrow{transition:transform .35s cubic-bezier(.2,.9,.3,1.3)}
.zone{border-radius:16px;border:1px dashed rgba(99,102,241,.35);background:linear-gradient(135deg,rgba(6,182,212,.07),rgba(99,102,241,.05))}
.zone.out{background:linear-gradient(135deg,rgba(236,72,153,.07),rgba(139,92,246,.07))}
.result{background:linear-gradient(135deg,#059669,#10b981 55%,#06b6d4);border-radius:18px}
.card.open .panel{animation:slideDown .35s cubic-bezier(.2,.8,.2,1)}

/* stats / company cards */
.stat,.co{border-radius:20px}
.stat b,.co .pv,.big b{text-shadow:0 2px 10px rgba(0,0,0,.18)}
.big{border-radius:20px}

/* tables */
.tscroll,.tbl-box{border-radius:18px}
.tbl-box{border:1px solid var(--line);background:transparent}
table{border-collapse:separate;border-spacing:0}
thead th,th{
  background:linear-gradient(135deg,rgba(99,102,241,.16),rgba(139,92,246,.10));color:var(--ink);font-weight:800;
  position:sticky;top:0;
}
tbody tr{transition:transform .2s}
tbody tr:hover td{background:rgba(99,102,241,.09)}
tbody tr:nth-child(even) td{background:rgba(99,102,241,.035)}
tbody tr:hover td{background:rgba(99,102,241,.10)}
tr.tot td,.tot td{background:linear-gradient(90deg,rgba(99,102,241,.2),rgba(236,72,153,.08))}
.pill{border-radius:999px}

/* lists (manage) */
.list li{border-radius:14px;transition:background .25s,padding .25s,transform .25s}
.list li:hover{transform:translateX(-3px)}

/* toasts */
.toast{border-radius:16px;backdrop-filter:blur(10px)}

/* stagger for generic dynamic items */
.stat,.co{animation-fill-mode:both}

/* mobile: bottom tab bar */
@media(max-width:760px){
  body{padding-bottom:84px}
  header{border-radius:0 0 20px 20px;padding:12px 16px}
  header h1{font-size:18px}
  .wrap{margin-top:14px}
  .side{
    position:fixed;top:auto;bottom:10px;left:10px;right:10px;width:auto;z-index:70;padding:8px;gap:6px;
    flex-direction:row;flex-wrap:nowrap;border-radius:24px;box-shadow:0 14px 40px rgba(31,27,75,.35);
  }
  .nav-item{flex:1;flex-direction:column;gap:2px;padding:8px 4px;font-size:11px;text-align:center;justify-content:center;border-radius:18px}
  .nav-item:hover{transform:none}
  .nav-item .ni{font-size:20px}
  .savebar{bottom:96px}
  .stats{grid-template-columns:1fr 1fr}
  .co-cards{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<header>
  <h1>إدارة المناديب</h1>
  <button class="hbtn theme" id="themeBtn" onclick="toggleTheme(this)" title="تبديل الوضع">🌙</button>
</header>

<div id="toasts"></div>

<div class="wrap">
  <aside class="side">
    <div class="side-title">القايمة</div>
    <a class="nav-item" href="index.html"><span class="ni">📊</span> حسابات المناديب</a>
    <a class="nav-item hl on" href="manage.html"><span class="ni">👥</span> المناديب</a>
    <a class="nav-item" href="transfers.html"><span class="ni">💸</span> التحويلات</a>
    <a class="nav-item" href="profit.html"><span class="ni">📈</span> أرباح الشركة</a>
  </aside>

  <main class="content">
    <div class="card">
      <h2>المناديب الحاليين</h2>
      <ul class="list" id="repList"><li class="muted">جاري التحميل...</li></ul>
    </div>

    <div class="card">
      <h2>إضافة مندوب جديد</h2>
      <div class="formrow">
        <div>
          <label>اسم المندوب</label>
          <input type="text" id="newName" placeholder="اكتب الاسم">
        </div>
        <div>
          <label>العمولة</label>
          <input type="number" id="newRate" value="27" min="1">
        </div>
      </div>
      <button class="btn full" id="btnAdd" onclick="addRep()">➕ إضافة المندوب</button>
    </div>

    <div class="card">
      <h2>حذف مندوب</h2>
      <div class="formrow">
        <div id="delBox"></div>
        <button class="btn danger" id="btnDel" onclick="deleteRep()">🗑️ حذف</button>
      </div>
    </div>
  </main>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwtdP1cSfohJVXLaJmOWcokwK9DJEJbAwUVSt1bG695tGMc5oAdmFJzbppo86mCPhw_/exec';

let reps = [];

function call(action, params = {}) {
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    const qs = new URLSearchParams({ ...params, action, callback: cbName });
    const script = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('انتهت مهلة الاتصال، جرب تاني')); }, 20000);
    function cleanup() { clearTimeout(timer); delete window[cbName]; script.remove(); }
    window[cbName] = res => {
      cleanup();
      if (res && res.ok) resolve(res.data);
      else reject(new Error((res && res.error) || 'حصل خطأ'));
    };
    script.onerror = () => { cleanup(); reject(new Error('فشل الاتصال بالسيرفر، اتأكد من اللينك والنشر')); };
    script.src = API_URL + '?' + qs.toString();
    document.body.appendChild(script);
  });
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ---------- الوضع ----------

function paintThemeBtn(theme) { const b = document.getElementById('themeBtn'); if (b) b.textContent = theme === 'dark' ? '☀️' : '🌙'; }

function toggleTheme(btn) {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  paintThemeBtn(next);
  if (btn) { btn.classList.remove('spin'); void btn.offsetWidth; btn.classList.add('spin'); }
}

// ---------- القايمة المنسدلة ----------

function ddHTML(opts, value, placeholder, extra = '') {
  const cur = value !== '' ? opts.find(o => o.v === value) : null;
  const label = cur ? cur.l : placeholder;
  return `<div class="dd${cur ? '' : ' empty'}" data-value="${esc(cur ? value : '')}" ${extra}>
    <button type="button" class="dd-btn"><span class="dd-label">${esc(label)}</span><span class="dd-chev">▾</span></button>
    <div class="dd-menu">${opts.map((o, k) =>
      `<div class="dd-item${cur && o.v === value ? ' sel' : ''}${o.v === '' ? ' placeholder' : ''}" data-v="${esc(o.v)}" style="--k:${k}">${esc(o.l)}</div>`
    ).join('')}</div>
  </div>`;
}

function pickDd(item) {
  const root = item.closest('.dd');
  const v = item.dataset.v;
  root.dataset.value = v;
  root.querySelector('.dd-label').textContent = item.textContent;
  root.classList.toggle('empty', v === '');
  root.querySelectorAll('.dd-item').forEach(x => x.classList.toggle('sel', x === item && v !== ''));
  root.classList.remove('open');
}

document.addEventListener('click', e => {
  const item = e.target.closest('.dd-item');
  if (item) { pickDd(item); return; }
  const btn = e.target.closest('.dd-btn');
  const root = btn ? btn.closest('.dd') : null;
  const wasOpen = root && root.classList.contains('open');
  document.querySelectorAll('.dd.open').forEach(d => d.classList.remove('open'));
  if (root && !wasOpen) root.classList.add('open');
});

// ---------- الصفحة ----------

function toast(text, ok) {
  const t = document.createElement('div');
  t.className = 'toast ' + (ok ? 'ok' : 'err');
  t.textContent = text;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 4000);
}

function render() {
  const list = document.getElementById('repList');
  const box = document.getElementById('delBox');

  if (!reps.length) {
    list.innerHTML = '<li class="muted">مفيش مناديب</li>';
    box.innerHTML = '<div class="muted">مفيش مناديب</div>';
    return;
  }

  list.innerHTML = reps.map(r =>
    '<li><span class="rep-name">' + esc(r.name) + '</span><span class="rate">العمولة: ' + r.rate + '</span></li>'
  ).join('');

  const opts = [{ v: '', l: '-- اختار المندوب --' }].concat(reps.map(r => ({ v: r.name, l: r.name })));
  box.innerHTML = ddHTML(opts, '', '-- اختار المندوب --', 'id="delSelect"');
}

async function loadReps() {
  try {
    reps = (await call('getReps')) || [];
    render();
  } catch (e) {
    toast('تعذر تحميل المناديب: ' + e.message, false);
  }
}

async function addRep() {
  const nameEl = document.getElementById('newName');
  const rateEl = document.getElementById('newRate');
  const name = nameEl.value.trim();
  const rate = Number(rateEl.value);
  if (!name) return toast('اكتب اسم المندوب', false);
  if (!(rate > 0)) return toast('اكتب العمولة', false);

  const btn = document.getElementById('btnAdd');
  btn.disabled = true;
  try {
    await call('addRep', { name: name, rate: rate });
    nameEl.value = '';
    rateEl.value = '27';
    toast('تم إضافة ' + name, true);
    await loadReps();
  } catch (e) {
    toast(e.message, false);
  } finally {
    btn.disabled = false;
  }
}

async function deleteRep() {
  const sel = document.getElementById('delSelect');
  const name = sel ? sel.dataset.value : '';
  if (!name) return toast('اختار المندوب الأول', false);
  if (!confirm('متأكد إنك عايز تحذف ' + name + '؟\nهيتشال من القايمة، والأيام القديمة هتفضل زي ما هي.')) return;

  const btn = document.getElementById('btnDel');
  btn.disabled = true;
  try {
    await call('deleteRep', { name: name });
    toast('تم حذف ' + name, true);
    await loadReps();
  } catch (e) {
    toast(e.message, false);
  } finally {
    btn.disabled = false;
  }
}

(function init() {
  const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = dark ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  paintThemeBtn(theme);
  loadReps();
})();
</script>

<script>
/* redesign layer: ripple + smooth page transition */
(function(){
  document.addEventListener('click',function(e){
    var b=e.target.closest('.navbtn,.btn,.savebar button,.dd-addbtn,.hbtn,.seg button');
    if(!b||b.disabled)return;
    var r=b.getBoundingClientRect(),s=Math.max(r.width,r.height),d=document.createElement('span');
    d.className='ripple';d.style.width=d.style.height=s+'px';
    d.style.left=(e.clientX-r.left-s/2)+'px';d.style.top=(e.clientY-r.top-s/2)+'px';
    if(getComputedStyle(b).position==='static')b.style.position='relative';
    b.style.overflow='hidden';b.appendChild(d);setTimeout(function(){d.remove()},650);
  });
  document.addEventListener('click',function(e){
    var a=e.target.closest('a.nav-item');
    if(!a||a.classList.contains('on')||e.metaKey||e.ctrlKey)return;
    e.preventDefault();document.body.classList.add('leaving');
    setTimeout(function(){location.href=a.getAttribute('href')},200);
  });
  window.addEventListener('pageshow',function(){document.body.classList.remove('leaving')});
})();
</script>
</body>
