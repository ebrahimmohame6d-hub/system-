<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة المناديب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
</head>
<body>

<header>
  <h1>👥 إدارة المناديب</h1>
  <button class="hbtn theme" id="themeBtn" onclick="toggleTheme(this)" title="تبديل الوضع">🌙</button>
</header>

<div id="toasts"></div>

<div class="wrap">
  <aside class="side">
    <div class="side-title">القايمة</div>
    <a class="nav-item" href="index.html"><span class="ni">📊</span> حسابات المناديب</a>
    <a class="nav-item on" href="manage.html"><span class="ni">👥</span> المناديب</a>
    <a class="nav-item" href="transfers.html"><span class="ni">💸</span> التحويلات</a>
    <a class="nav-item" href="profit.html"><span class="ni">📈</span> أرباح الشركة</a>
    <a class="nav-item" href="weekly.html"><span class="ni">🗓️</span> حساب الأسبوعي</a>
    <a class="nav-item" href="gamiya.html"><span class="ni">🤝</span> الجمعية</a>
  </aside>

  <main class="content">
    <div class="card">
      <h2 class="sec">قايمة المناديب</h2>
      <ul class="list" id="repsList">
        <li class="muted">جاري التحميل...</li>
      </ul>
    </div>

    <div class="card">
      <h2 class="sec">إضافة مندوب جديد</h2>
      <div class="formrow" style="grid-template-columns:1fr 110px 150px">
        <div>
          <label>اسم المندوب</label>
          <input type="text" id="newName" placeholder="اكتب الاسم">
        </div>
        <div>
          <label>العمولة</label>
          <input type="number" id="newRate" inputmode="numeric" min="1" value="27">
        </div>
        <div>
          <label>نظام الحساب</label>
          <div id="newTypeWrap"></div>
        </div>
      </div>
      <button type="button" class="btn full" id="btnAdd" onclick="addNewRep()">➕ إضافة المندوب</button>
    </div>
  </main>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwtdP1cSfohJVXLaJmOWcokwK9DJEJbAwUVSt1bG695tGMc5oAdmFJzbppo86mCPhw_/exec';

const TYPE_OPTS = [
  { v: 'daily', l: 'يومي' },
  { v: 'weekly', l: 'أسبوعي' }
];

let reps = [];
let editingIdx = -1;
const $ = id => document.getElementById(id);

function call(action, params = {}) {
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    const qs = new URLSearchParams({ ...params, action, callback: cbName });
    const script = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('انتهت مهلة الاتصال، جرب تاني')); }, 20000);
    function cleanup() { clearTimeout(timer); delete window[cbName]; script.remove(); }
    window[cbName] = res => {
      cleanup();
      if (res && res.ok) resolve(res.data);
      else reject(new Error((res && res.error) || 'حصل خطأ'));
    };
    script.onerror = () => { cleanup(); reject(new Error('فشل الاتصال بالسيرفر')); };
    script.src = API_URL + '?' + qs.toString();
    document.body.appendChild(script);
  });
}

function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function paintThemeBtn(th) { const b = $('themeBtn'); if (b) b.textContent = th === 'dark' ? '☀️' : '🌙'; }
function toggleTheme(btn) {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  paintThemeBtn(next);
  if (btn) { btn.classList.remove('spin'); void btn.offsetWidth; btn.classList.add('spin'); }
}
function toast(text, ok) {
  const t = document.createElement('div');
  t.className = 'toast ' + (ok ? 'ok' : 'err');
  t.textContent = text;
  $('toasts').appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 4000);
}

function ddHTML(opts, value, placeholder, extra = '') {
  const cur = value !== '' ? opts.find(o => o.v === value) : null;
  return `<div class="dd${cur ? '' : ' empty'}" data-value="${esc(cur ? value : '')}" ${extra}>
    <button type="button" class="dd-btn"><span class="dd-label">${esc(cur ? cur.l : placeholder)}</span><span class="dd-chev">▾</span></button>
    <div class="dd-menu">${opts.map((o, k) =>
      `<div class="dd-item${cur && o.v === value ? ' sel' : ''}${o.v === '' ? ' placeholder' : ''}" data-v="${esc(o.v)}" style="--k:${k}"><span class="dd-t">${esc(o.l)}</span></div>`
    ).join('')}</div></div>`;
}

function setDdValue(id, v) {
  const root = $(id);
  if (!root) return;
  const items = [...root.querySelectorAll('.dd-item')];
  const item = v !== '' ? items.find(x => x.dataset.v === v) : null;
  root.dataset.value = item ? v : '';
  root.querySelector('.dd-label').textContent = item ? item.textContent : items[0].textContent;
  root.classList.toggle('empty', !item);
  items.forEach(x => x.classList.toggle('sel', x === item));
}

document.addEventListener('click', e => {
  const item = e.target.closest('.dd-item');
  if (item) {
    const root = item.closest('.dd');
    const v = item.dataset.v;
    root.dataset.value = v;
    root.querySelector('.dd-label').textContent = (item.querySelector('.dd-t') || item).textContent;
    root.classList.toggle('empty', v === '');
    root.querySelectorAll('.dd-item').forEach(x => x.classList.toggle('sel', x === item && v !== ''));
    root.classList.remove('open');
    return;
  }
  if (e.target.closest('.dd-menu')) return;
  const btn = e.target.closest('.dd-btn');
  const root = btn ? btn.closest('.dd') : null;
  const wasOpen = root && root.classList.contains('open');
  document.querySelectorAll('.dd.open').forEach(d => d.classList.remove('open'));
  if (root && !wasOpen) root.classList.add('open');
});

function render() {
  if (!reps.length) {
    $('repsList').innerHTML = '<li class="muted">مفيش مناديب لسه</li>';
    return;
  }
  $('repsList').innerHTML = reps.map((r, idx) => {
    const isWeekly = r.payType === 'weekly';
    const typeBadge = isWeekly
      ? `<span class="badge" style="background:rgba(217,119,6,.16);color:#b45309">أسبوعي</span>`
      : `<span class="badge">يومي</span>`;
    const isEditing = editingIdx === idx;

    const editBox = isEditing ? `
      <div class="edit-drawer">
        <div>
          <label>نظام الحساب</label>
          ${ddHTML(TYPE_OPTS, r.payType || 'daily', 'اختار النظام', `id="editType-${idx}"`)}
        </div>
        <div>
          <label>العمولة</label>
          <input type="number" id="editRate-${idx}" inputmode="numeric" min="1" value="${r.rate}">
        </div>
        <div style="display:flex;gap:6px">
          <button type="button" class="btn" style="padding:11px 16px" onclick="saveEdit(${idx}, this)">💾 حفظ</button>
          <button type="button" class="btn ghost" style="padding:11px 12px" onclick="cancelEdit()">إلغاء</button>
        </div>
      </div>` : '';

    return `<li>
      <div class="rep-row">
        <div>
          <span>${esc(r.name)}</span>
          ${typeBadge}
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="rate">العمولة: ${r.rate}</span>
          <button type="button" class="editbtn" title="تعديل نظام الحساب والعمولة" onclick="openEdit(${idx})">✏️</button>
          <button type="button" class="del" title="حذف المندوب" onclick="removeRep(${idx})">🗑️</button>
        </div>
      </div>
      ${editBox}
    </li>`;
  }).join('');
}

function openEdit(idx) {
  editingIdx = (editingIdx === idx) ? -1 : idx;
  render();
}

function cancelEdit() {
  editingIdx = -1;
  render();
}

async function saveEdit(idx, btn) {
  const r = reps[idx];
  if (!r) return;
  const dd = $('editType-' + idx);
  const payType = (dd && dd.dataset.value) || 'daily';
  const rate = Number($('editRate-' + idx).value);
  if (!isFinite(rate) || rate <= 0) return toast('اكتب رقم عمولة صحيح أكبر من صفر', false);

  if (btn) { btn.disabled = true; btn.textContent = 'جاري الحفظ...'; }
  try {
    await call('updateRep', { name: r.name, rate, payType });
    r.payType = payType;
    r.rate = rate;
    editingIdx = -1;
    render();
    toast(`تم تعديل ${r.name} إلى (${payType === 'weekly' ? 'أسبوعي' : 'يومي'})`, true);
    await loadReps();
  } catch (e) {
    toast(e.message, false);
    if (btn) { btn.disabled = false; btn.textContent = '💾 حفظ'; }
  }
}

async function loadReps() {
  try {
    reps = (await call('getReps')) || [];
    render();
  } catch (e) {
    $('repsList').innerHTML = '<li class="muted">خطأ: ' + esc(e.message) + '</li>';
    toast(e.message, false);
  }
}

async function addNewRep() {
  const name = $('newName').value.trim();
  const rate = Number($('newRate').value);
  const dd = $('newType');
  const payType = (dd && dd.dataset.value) || 'daily';
  if (!name) return toast('اكتب اسم المندوب الأول', false);
  if (!isFinite(rate) || rate <= 0) return toast('اكتب عمولة صحيحة', false);

  const btn = $('btnAdd');
  btn.disabled = true;
  btn.textContent = 'جاري الإضافة...';
  try {
    await call('addRep', { name, rate, payType });
    $('newName').value = '';
    setDdValue('newType', 'daily');
    toast(`تم إضافة ${name} بنجاح`, true);
    await loadReps();
  } catch (e) {
    toast(e.message, false);
  } finally {
    btn.disabled = false;
    btn.textContent = '➕ إضافة المندوب';
  }
}

async function removeRep(idx) {
  const r = reps[idx];
  if (!r) return;
  if (!confirm(`متأكد إنك عايز تمسح المندوب "${r.name}"؟`)) return;
  try {
    await call('deleteRep', { name: r.name });
    if (editingIdx === idx) editingIdx = -1;
    toast(`تم حذف ${r.name}`, true);
    await loadReps();
  } catch (e) {
    toast(e.message, false);
  }
}

(function init() {
  const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = dark ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  paintThemeBtn(theme);
  $('newTypeWrap').innerHTML = ddHTML(TYPE_OPTS, 'daily', 'اختار النظام', 'id="newType"');
  loadReps();
})();
</script>
</body>
</html>
