<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>العمولات الأسبوعية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
.paid-btn{border:0;border-radius:12px;padding:9px 14px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;color:#fff;background:#9c8a6a;transition:background .2s,transform .2s;min-width:120px}
.paid-btn:hover{transform:translateY(-1px)}
.paid-btn.on{background:#3f8a5f}
</style>
</head>
<body>

<header>
  <h1>🗓️ العمولات الأسبوعية</h1>
  <button class="hbtn theme" id="themeBtn" onclick="toggleTheme(this)" title="تبديل الوضع">🌙</button>
</header>

<div id="toasts"></div>

<div class="wrap">
  <aside class="side">
    <div class="side-title">القايمة</div>
    <a class="nav-item" href="index.html"><span class="ni">📊</span> حسابات المناديب</a>
    <a class="nav-item" href="manage.html"><span class="ni">👥</span> المناديب</a>
    <a class="nav-item" href="transfers.html"><span class="ni">💸</span> التحويلات</a>
    <a class="nav-item" href="profit.html"><span class="ni">📈</span> أرباح الشركة</a>
    <a class="nav-item on" href="weekly.html"><span class="ni">🗓️</span> العمولات الأسبوعية</a>
  </aside>

  <main class="content">
    <div class="card">
      <div class="ctrl">
        <button class="btn" onclick="shift(1)">‹ الأسبوع اللي بعده</button>
        <input type="date" id="wDate" onchange="onDate(this.value)">
        <button class="btn" onclick="shift(-1)">الأسبوع اللي قبله ›</button>
      </div>
      <div class="muted" id="weekLabel" style="margin-top:12px"></div>
    </div>

    <div class="card">
      <div class="stats">
        <div class="stat s-all">إجمالي العمولات<b id="sTotal">0</b></div>
        <div class="stat s-cash">اتدفع<b id="sPaid">0</b></div>
        <div class="stat s-voda">لسه مستحق<b id="sDue">0</b></div>
      </div>
    </div>

    <div class="card">
      <h2 class="sec">المناديب الأسبوعيين</h2>
      <div id="wBox"><div class="muted">جاري التحميل...</div></div>
    </div>
  </main>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwtdP1cSfohJVXLaJmOWcokwK9DJEJbAwUVSt1bG695tGMc5oAdmFJzbppo86mCPhw_/exec';

let curDate = '';
const $ = id => document.getElementById(id);

function call(action, params = {}) {
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    const qs = new URLSearchParams({ ...params, action, callback: cbName });
    const script = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('انتهت مهلة الاتصال، جرب تاني')); }, 20000);
    function cleanup() { clearTimeout(timer); delete window[cbName]; script.remove(); }
    window[cbName] = res => {
      cleanup();
      if (res && res.ok) resolve(res.data);
      else reject(new Error((res && res.error) || 'حصل خطأ'));
    };
    script.onerror = () => { cleanup(); reject(new Error('فشل الاتصال بالسيرفر')); };
    script.src = API_URL + '?' + qs.toString();
    document.body.appendChild(script);
  });
}

function fmt(n) { return Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
function pad(n) { return String(n).padStart(2, '0'); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function addDays(iso, n) { const [y,m,d] = iso.split('-').map(Number); const x = new Date(y, m-1, d+n); return x.getFullYear() + '-' + pad(x.getMonth()+1) + '-' + pad(x.getDate()); }
function dmy(iso) { const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3]+'/'+m[2]+'/'+m[1] : esc(iso); }

function paintThemeBtn(th) { const b = $('themeBtn'); if (b) b.textContent = th === 'dark' ? '☀️' : '🌙'; }
function toggleTheme(btn) {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  paintThemeBtn(next);
  if (btn) { btn.classList.remove('spin'); void btn.offsetWidth; btn.classList.add('spin'); }
}
function toast(text, ok) {
  const t = document.createElement('div');
  t.className = 'toast ' + (ok ? 'ok' : 'err');
  t.textContent = text;
  $('toasts').appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 4000);
}

async function render() {
  $('wBox').innerHTML = '<div class="muted">جاري التحميل...</div>';
  try {
    const w = await call('getWeekly', { date: curDate });
    $('weekLabel').textContent = 'الأسبوع من ' + dmy(w.start) + ' لحد ' + dmy(w.end);
    $('wDate').value = curDate;

    if (!w.reps.length) {
      $('wBox').innerHTML = '<div class="muted">مفيش مناديب بعمولة أسبوعية</div>';
      $('sTotal').textContent = '0'; $('sPaid').textContent = '0'; $('sDue').textContent = '0';
      return;
    }

    let total = 0, paid = 0;
    const body = w.reps.map(r => {
      total += r.commission;
      if (r.paid) paid += r.commission;
      return `<tr>
        <td class="name">${esc(r.name)}</td>
        <td><span class="pill">${r.count}</span></td>
        <td><span class="amt">${fmt(r.commission)}</span></td>
        <td><button class="paid-btn${r.paid ? ' on' : ''}" data-rep="${esc(r.name)}" data-paid="${r.paid ? 1 : 0}">${r.paid ? 'اتدفع ✓' : 'لسه ما اتدفعش'}</button></td>
      </tr>`;
    }).join('');

    $('wBox').innerHTML = `<div class="tscroll"><table>
      <thead><tr><th>المندوب</th><th>عدد الشحنات</th><th>العمولة</th><th>الحالة</th></tr></thead>
      <tbody>${body}
        <tr class="tot"><td class="name">الإجمالي</td><td></td><td><span class="amt">${fmt(total)}</span></td><td></td></tr>
      </tbody></table></div>`;

    $('sTotal').textContent = fmt(total);
    $('sPaid').textContent = fmt(paid);
    $('sDue').textContent = fmt(total - paid);
  } catch (e) {
    $('wBox').innerHTML = '<div class="muted">خطأ: ' + esc(e.message) + '</div>';
    toast(e.message, false);
  }
}

$('wBox').addEventListener('click', async e => {
  const b = e.target.closest('[data-rep]');
  if (!b) return;
  const name = b.dataset.rep;
  const nowPaid = b.dataset.paid !== '1';
  b.disabled = true;
  try {
    await call('setWeeklyPaid', { week: curDate, rep: name, paid: nowPaid });
    await render();
  } catch (err) {
    toast(err.message, false);
    b.disabled = false;
  }
});

function onDate(v) { if (!v) return; curDate = v; render(); }
function shift(n) { curDate = addDays(curDate || todayISO(), 7 * n); render(); }

(function init() {
  const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = dark ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  paintThemeBtn(theme);
  curDate = todayISO();
  render();
})();
</script>
</body>
</html>
