<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حساب الأسبوعي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
</head>
<body>

<header>
  <h1>🗓️ حساب الأسبوعي</h1>
  <button class="hbtn theme" id="themeBtn" onclick="toggleTheme(this)" title="تبديل الوضع">🌙</button>
</header>

<div id="toasts"></div>

<div class="wrap">
  <aside class="side">
    <div class="side-title">القايمة</div>
    <a class="nav-item" href="index.html"><span class="ni">📊</span> حسابات المناديب</a>
    <a class="nav-item" href="manage.html"><span class="ni">👥</span> المناديب</a>
    <a class="nav-item" href="transfers.html"><span class="ni">💸</span> التحويلات</a>
    <a class="nav-item" href="profit.html"><span class="ni">📈</span> أرباح الشركة</a>
    <a class="nav-item on" href="weekly.html"><span class="ni">🗓️</span> حساب الأسبوعي</a>
    <a class="nav-item" href="gamiya.html"><span class="ni">🤝</span> الجمعية</a>
  </aside>

  <main class="content">
    <div class="card">
      <h2 class="sec">اختيار المندوب والفترة</h2>
      <div class="grid" style="grid-template-columns:1fr 1fr 1fr;margin-top:0">
        <div>
          <label>المندوب</label>
          <select id="repSelect" onchange="loadWeekly()"></select>
        </div>
        <div>
          <label>من تاريخ</label>
          <input type="date" id="wFrom" onchange="loadWeekly()">
        </div>
        <div>
          <label>إلى تاريخ</label>
          <input type="date" id="wTo" onchange="loadWeekly()">
        </div>
      </div>

      <div class="ctrl" style="margin-top:12px">
        <button type="button" class="btn" style="padding:8px 12px;font-size:13px" onclick="setPreset('thisWeek')">الأسبوع الحالي</button>
        <button type="button" class="btn" style="padding:8px 12px;font-size:13px" onclick="setPreset('last7')">آخر 7 أيام</button>
        <button type="button" class="btn" style="padding:8px 12px;font-size:13px" onclick="setPreset('lastWeek')">الأسبوع الماضي</button>
      </div>
    </div>

    <div class="card">
      <div class="stats" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px">
        <div class="stat s-all">إجمالي الشحنات<b id="stCount">0</b></div>
        <div class="stat s-insta">إجمالي المبيعات<b id="stTotal">0</b></div>
        <div class="stat s-cash">مستحق المندوب (العمولة)<b id="stComm">0</b></div>
      </div>
      <div class="big"><span>صافي عمولة المندوب الأسبوعية</span><b id="bigComm">0</b></div>
    </div>

    <div class="card">
      <h2 class="sec">تفصيل الأيام</h2>
      <div class="tbl-box"><div id="daysTable" class="tscroll"><div class="muted" style="padding:14px">جاري التحميل...</div></div></div>
    </div>
  </main>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwtdP1cSfohJVXLaJmOWcokwK9DJEJbAwUVSt1bG695tGMc5oAdmFJzbppo86mCPhw_/exec';

let reps = [];
const $ = id => document.getElementById(id);

function call(action, params = {}) {
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    const qs = new URLSearchParams({ ...params, action, callback: cbName });
    const script = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('انتهت مهلة الاتصال، جرب تاني')); }, 20000);
    function cleanup() { clearTimeout(timer); delete window[cbName]; script.remove(); }
    window[cbName] = res => {
      cleanup();
      if (res && res.ok) resolve(res.data);
      else reject(new Error((res && res.error) || 'حصل خطأ'));
    };
    script.onerror = () => { cleanup(); reject(new Error('فشل الاتصال بالسيرفر')); };
    script.src = API_URL + '?' + qs.toString();
    document.body.appendChild(script);
  });
}

function fmt(n) { return Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
function pad(n) { return String(n).padStart(2, '0'); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function addDays(iso, n) { const [y,m,d] = iso.split('-').map(Number); const x = new Date(y, m-1, d+n); return x.getFullYear() + '-' + pad(x.getMonth()+1) + '-' + pad(x.getDate()); }
function dmy(iso) { const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3]+'/'+m[2]+'/'+m[1] : esc(iso); }

function paintThemeBtn(th) { const b = $('themeBtn'); if (b) b.textContent = th === 'dark' ? '☀️' : '🌙'; }
function toggleTheme(btn) {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  paintThemeBtn(next);
  if (btn) { btn.classList.remove('spin'); void btn.offsetWidth; btn.classList.add('spin'); }
}
function toast(text, ok) {
  const t = document.createElement('div');
  t.className = 'toast ' + (ok ? 'ok' : 'err');
  t.textContent = text;
  $('toasts').appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 4000);
}

function setPreset(type) {
  const today = todayISO();
  if (type === 'last7') {
    $('wFrom').value = addDays(today, -6);
    $('wTo').value = today;
  } else if (type === 'thisWeek') {
    const d = new Date();
    const diffToSat = (d.getDay() + 1) % 7;
    const sat = addDays(today, -diffToSat);
    $('wFrom').value = sat;
    $('wTo').value = addDays(sat, 6);
  } else if (type === 'lastWeek') {
    const d = new Date();
    const diffToSat = (d.getDay() + 1) % 7;
    const sat = addDays(today, -diffToSat);
    $('wFrom').value = addDays(sat, -7);
    $('wTo').value = addDays(sat, -1);
  }
  loadWeekly();
}

async function loadWeekly() {
  const rep = $('repSelect').value;
  if (!rep) {
    $('daysTable').innerHTML = '<div class="muted" style="padding:14px">اختار مندوب</div>';
    return;
  }
  $('daysTable').innerHTML = '<div class="muted" style="padding:14px">جاري التحميل...</div>';
  try {
    const days = (await call('getRepWeekly', {
      rep,
      from: $('wFrom').value,
      to: $('wTo').value
    })) || [];

    let totCount = 0, totSales = 0, totComm = 0;
    days.forEach(d => {
      totCount += Number(d.count) || 0;
      totSales += Number(d.total) || 0;
      totComm += Number(d.commission) || 0;
    });

    $('stCount').textContent = fmt(totCount);
    $('stTotal').textContent = fmt(totSales);
    $('stComm').textContent = fmt(totComm);
    $('bigComm').textContent = fmt(totComm);

    if (!days.length) {
      $('daysTable').innerHTML = '<div class="muted" style="padding:14px">مفيش أيام مسجلة للمندوب ده في الفترة المختارة</div>';
      return;
    }

    const body = days.map(d => `<tr>
      <td>${dmy(d.date)}</td>
      <td><span class="pill">${d.count}</span></td>
      <td class="amt">${fmt(d.rate)}</td>
      <td class="amt">${fmt(d.total)}</td>
      <td><span class="pill pos">${fmt(d.commission)}</span></td>
    </tr>`).join('');

    $('daysTable').innerHTML = `<table>
      <thead><tr><th>التاريخ</th><th>عدد الشحنات</th><th>العمولة</th><th>إجمالي المبيعات</th><th>مستحق المندوب</th></tr></thead>
      <tbody>${body}
        <tr class="tot">
          <td>الإجمالي (${days.length} يوم)</td>
          <td><span class="pill">${totCount}</span></td>
          <td>—</td>
          <td class="amt">${fmt(totSales)}</td>
          <td><span class="pill pos">${fmt(totComm)}</span></td>
        </tr>
      </tbody></table>`;
  } catch (e) {
    $('daysTable').innerHTML = '<div class="muted" style="padding:14px">خطأ: ' + esc(e.message) + '</div>';
    toast(e.message, false);
  }
}

(async function init() {
  const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = dark ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  paintThemeBtn(theme);

  try {
    reps = (await call('getReps')) || [];
    const sorted = [...reps].sort((a, b) => (b.payType === 'weekly' ? 1 : 0) - (a.payType === 'weekly' ? 1 : 0));
    $('repSelect').innerHTML = sorted.map(r =>
      `<option value="${esc(r.name)}">${esc(r.name)}${r.payType === 'weekly' ? ' (أسبوعي)' : ''}</option>`
    ).join('');
  } catch (e) {
    toast('تعذر تحميل المناديب: ' + e.message, false);
  }

  setPreset('thisWeek');
})();
</script>
</body>
</html>
