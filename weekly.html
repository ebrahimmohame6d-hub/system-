<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حساب الأسبوعي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
</head>
<body>

<header>
  <h1>🗓️ حساب الأسبوعي</h1>
  <button class="hbtn theme" id="themeBtn" onclick="toggleTheme(this)" title="تبديل الوضع">🌙</button>
</header>

<div id="toasts"></div>

<div class="wrap">
  <aside class="side">
    <div class="side-title">القايمة</div>
    <a class="nav-item" href="index.html"><span class="ni">📊</span> حسابات المناديب</a>
    <a class="nav-item" href="manage.html"><span class="ni">👥</span> المناديب</a>
    <a class="nav-item" href="transfers.html"><span class="ni">💸</span> التحويلات</a>
    <a class="nav-item" href="profit.html"><span class="ni">📈</span> أرباح الشركة</a>
    <a class="nav-item on" href="weekly.html"><span class="ni">🗓️</span> حساب الأسبوعي</a>
    <a class="nav-item" href="gamiya.html"><span class="ni">🤝</span> الجمعية</a>
  </aside>

  <main class="content">
    <div class="card">
      <div class="formrow" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:10px">
        <div>
          <label>المندوب</label>
          <div id="repSelWrap"></div>
        </div>
        <div>
          <label>من تاريخ</label>
          <input type="date" id="fromDate" onchange="loadWeekly()">
        </div>
        <div>
          <label>إلى تاريخ</label>
          <input type="date" id="toDate" onchange="loadWeekly()">
        </div>
      </div>
      <div class="ctrl">
        <button type="button" class="btn ghost" style="padding:8px 12px;font-size:13px" onclick="setQuickRange(7)">آخر 7 أيام</button>
        <button type="button" class="btn ghost" style="padding:8px 12px;font-size:13px" onclick="setQuickRange(14)">آخر أسبوعين</button>
        <button type="button" class="btn ghost" style="padding:8px 12px;font-size:13px" onclick="setAllRange()">كل الأيام</button>
        <button type="button" class="btn" style="padding:8px 14px;font-size:13px;margin-right:auto" onclick="copyReport()">📋 نسخ الكشف</button>
      </div>
    </div>

    <div class="card">
      <div class="big" style="margin-bottom:14px">
        <span>إجمالي عمولة المندوب المستحقة</span>
        <b id="bigComm">0</b>
      </div>
      <div class="stats" style="grid-template-columns:repeat(3,1fr)">
        <div class="stat s-all">إجمالي التحصيل<b id="stTotal">0</b></div>
        <div class="stat s-cash">عدد الشحنات<b id="stCount">0</b></div>
        <div class="stat s-insta">عدد أيام الشغل<b id="stDays">0</b></div>
      </div>
    </div>

    <div class="card">
      <h2 class="sec">تفصيل الأيام</h2>
      <div class="tbl-box">
        <div class="tscroll">
          <table>
            <thead>
              <tr>
                <th>التاريخ</th>
                <th>الإجمالي</th>
                <th>عدد الشحنات</th>
                <th>سعر الشحنة</th>
                <th>العمولة</th>
              </tr>
            </thead>
            <tbody id="daysBody">
              <tr><td colspan="5" class="muted">جاري التحميل...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwtdP1cSfohJVXLaJmOWcokwK9DJEJbAwUVSt1bG695tGMc5oAdmFJzbppo86mCPhw_/exec';

let reps = [];
let currentDays = [];
const $ = id => document.getElementById(id);

function call(action, params = {}) {
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    const qs = new URLSearchParams({ ...params, action, callback: cbName });
    const script = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('انتهت مهلة الاتصال، جرب تاني')); }, 20000);
    function cleanup() { clearTimeout(timer); delete window[cbName]; script.remove(); }
    window[cbName] = res => {
      cleanup();
      if (res && res.ok) resolve(res.data);
      else reject(new Error((res && res.error) || 'حصل خطأ'));
    };
    script.onerror = () => { cleanup(); reject(new Error('فشل الاتصال بالسيرفر')); };
    script.src = API_URL + '?' + qs.toString();
    document.body.appendChild(script);
  });
}

function fmt(n) { return Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
function pad(n) { return String(n).padStart(2, '0'); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function addDays(iso, n) { const [y,m,d] = iso.split('-').map(Number); const x = new Date(y, m-1, d+n); return x.getFullYear() + '-' + pad(x.getMonth()+1) + '-' + pad(x.getDate()); }
function dmy(iso) { const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3]+'/'+m[2]+'/'+m[1] : esc(iso); }

function paintThemeBtn(th) { const b = $('themeBtn'); if (b) b.textContent = th === 'dark' ? '☀️' : '🌙'; }
function toggleTheme(btn) {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  paintThemeBtn(next);
  if (btn) { btn.classList.remove('spin'); void btn.offsetWidth; btn.classList.add('spin'); }
}
function toast(text, ok) {
  const t = document.createElement('div');
  t.className = 'toast ' + (ok ? 'ok' : 'err');
  t.textContent = text;
  $('toasts').appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 4000);
}

function ddHTML(opts, value, placeholder, extra = '') {
  const cur = value !== '' ? opts.find(o => o.v === value) : null;
  return `<div class="dd${cur ? '' : ' empty'}" data-value="${esc(cur ? value : '')}" ${extra}>
    <button type="button" class="dd-btn"><span class="dd-label">${esc(cur ? cur.l : placeholder)}</span><span class="dd-chev">▾</span></button>
    <div class="dd-menu">${opts.map((o, k) =>
      `<div class="dd-item${cur && o.v === value ? ' sel' : ''}${o.v === '' ? ' placeholder' : ''}" data-v="${esc(o.v)}" style="--k:${k}"><span class="dd-t">${esc(o.l)}</span></div>`
    ).join('')}</div></div>`;
}

document.addEventListener('click', e => {
  const item = e.target.closest('.dd-item');
  if (item) {
    const root = item.closest('.dd');
    const v = item.dataset.v;
    root.dataset.value = v;
    root.querySelector('.dd-label').textContent = (item.querySelector('.dd-t') || item).textContent;
    root.classList.toggle('empty', v === '');
    root.querySelectorAll('.dd-item').forEach(x => x.classList.toggle('sel', x === item && v !== ''));
    root.classList.remove('open');
    if (root.id === 'repSel') loadWeekly();
    return;
  }
  if (e.target.closest('.dd-menu')) return;
  const btn = e.target.closest('.dd-btn');
  const root = btn ? btn.closest('.dd') : null;
  const wasOpen = root && root.classList.contains('open');
  document.querySelectorAll('.dd.open').forEach(d => d.classList.remove('open'));
  if (root && !wasOpen) root.classList.add('open');
});

function setQuickRange(daysBack) {
  const today = todayISO();
  $('fromDate').value = addDays(today, -(daysBack - 1));
  $('toDate').value = today;
  loadWeekly();
}

function setAllRange() {
  $('fromDate').value = '';
  $('toDate').value = '';
  loadWeekly();
}

async function loadWeekly() {
  const dd = $('repSel');
  const rep = dd ? dd.dataset.value : '';
  if (!rep) return;

  $('daysBody').innerHTML = '<tr><td colspan="5" class="muted">جاري التحميل...</td></tr>';
  try {
    currentDays = (await call('getRepWeekly', {
      rep,
      from: $('fromDate').value || '',
      to: $('toDate').value || ''
    })) || [];
    renderWeekly();
  } catch (e) {
    $('daysBody').innerHTML = '<tr><td colspan="5" class="muted">خطأ: ' + esc(e.message) + '</td></tr>';
    toast(e.message, false);
  }
}

function renderWeekly() {
  let sumTotal = 0, sumCount = 0, sumComm = 0;
  currentDays.forEach(d => {
    sumTotal += Number(d.total) || 0;
    sumCount += Number(d.count) || 0;
    sumComm += Number(d.commission) || 0;
  });

  $('bigComm').textContent = fmt(sumComm);
  $('stTotal').textContent = fmt(sumTotal);
  $('stCount').textContent = fmt(sumCount);
  $('stDays').textContent = currentDays.length;

  if (!currentDays.length) {
    $('daysBody').innerHTML = '<tr><td colspan="5" class="muted">مفيش أيام شغل مسجلة للمندوب ده في الفترة المختارة</td></tr>';
    return;
  }

  $('daysBody').innerHTML = currentDays.map(d => `<tr>
    <td>${dmy(d.date)}</td>
    <td class="amt">${fmt(d.total)}</td>
    <td class="amt">${d.count}</td>
    <td class="amt">${fmt(d.rate)}</td>
    <td class="amt"><span class="pill pos">${fmt(d.commission)}</span></td>
  </tr>`).join('') + `
    <tr class="tot">
      <td>الإجمالي</td>
      <td class="amt">${fmt(sumTotal)}</td>
      <td class="amt">${sumCount}</td>
      <td>—</td>
      <td class="amt">${fmt(sumComm)}</td>
    </tr>`;
}

function copyReport() {
  const dd = $('repSel');
  const rep = dd ? dd.dataset.value : '';
  if (!rep) return;
  let sumTotal = 0, sumCount = 0, sumComm = 0;
  const lines = currentDays.map(d => {
    sumTotal += Number(d.total) || 0;
    sumCount += Number(d.count) || 0;
    sumComm += Number(d.commission) || 0;
    return `• ${dmy(d.date)}: ${d.count} شحنة — عمولة ${fmt(d.commission)}`;
  });

  const txt = [
    `كشف حساب المندوب: ${rep}`,
    ...lines,
    `----------------`,
    `إجمالي الشحنات: ${sumCount}`,
    `إجمالي التحصيل: ${fmt(sumTotal)}`,
    `العمولة المستحقة: ${fmt(sumComm)}`
  ].join('\n');

  navigator.clipboard.writeText(txt)
    .then(() => toast('تم نسخ كشف الحساب', true))
    .catch(() => toast('تعذر النسخ', false));
}

(async function init() {
  const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = dark ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  paintThemeBtn(theme);

  const today = todayISO();
  $('fromDate').value = addDays(today, -6);
  $('toDate').value = today;
  $('repSelWrap').innerHTML = ddHTML([], '', '-- اختر المندوب --', 'id="repSel"');

  try {
    reps = (await call('getReps')) || [];
    const sorted = [...reps].sort((a, b) => (b.payType === 'weekly') - (a.payType === 'weekly'));
    const opts = sorted.map(r => ({
      v: r.name,
      l: `${r.name} (${r.payType === 'weekly' ? 'أسبوعي' : 'يومي'})`
    }));
    const firstVal = opts.length ? opts[0].v : '';
    $('repSelWrap').innerHTML = ddHTML(opts, firstVal, '-- اختر المندوب --', 'id="repSel"');
  } catch (e) {
    toast(e.message, false);
  }
  loadWeekly();
})();
</script>
</body>
</html>
