<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حسابات المناديب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f8; --surface:#ffffff; --surface2:#f4f6fc; --ink:#1b2140; --muted:#5b6485; --line:#e3e7f3;
  --p1:#4f46e5; --p2:#7c3aed; --ok:#10b981; --bad:#ef4444;
  --shadow:0 4px 18px rgba(79,70,229,.08);
}
[data-theme="dark"]{
  --bg:#0d1125; --surface:#161b37; --surface2:#1d2346; --ink:#f1f3ff; --muted:#b4bde3; --line:#2a3160;
  --shadow:0 4px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:90px;transition:background .3s,color .3s}
header{
  display:flex;align-items:center;justify-content:space-between;padding:16px 20px;color:#fff;
  background:linear-gradient(120deg,#4f46e5,#7c3aed,#0ea5e9);background-size:300% 300%;
  box-shadow:0 6px 24px rgba(79,70,229,.3);animation:shimmer 10s ease infinite;
}
header h1{margin:0;font-family:'Cairo',Tahoma,Arial,sans-serif;font-size:21px;font-weight:800;animation:fadeUp .5s both}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.hbtn{
  height:40px;padding:0 14px;border-radius:12px;border:0;cursor:pointer;background:rgba(255,255,255,.2);
  color:#fff;font-family:inherit;font-size:14px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px;
  transition:transform .2s,background .2s,box-shadow .2s;
}
.hbtn:hover{transform:translateY(-2px);background:rgba(255,255,255,.32)}
.hbtn:active{transform:scale(.96)}
.hbtn-hl{
  background:linear-gradient(135deg,#fbbf24,#f97316);font-weight:800;padding:0 18px;font-size:15px;
  animation:glow 2s ease-in-out infinite,floatY 3s ease-in-out infinite;
}
.hbtn-hl:hover{background:linear-gradient(135deg,#fcd34d,#fb923c);transform:translateY(-3px) scale(1.05)}
.hbtn-hl .ico{display:inline-block}
.hbtn-hl .ico svg{animation:personBob 2.4s ease-in-out infinite}
.hbtn-hl:hover .ico svg{animation:personWave .6s ease}
.hbtn-tr{background:linear-gradient(135deg,#06b6d4,#3b82f6);font-weight:800}
.hbtn-tr:hover{background:linear-gradient(135deg,#22d3ee,#60a5fa)}
.hbtn-tr .ico{display:inline-block;animation:floatY 2.6s ease-in-out infinite}
main{max-width:760px;margin:20px auto;padding:0 14px}
.card{
  position:relative;z-index:1;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
  margin-bottom:12px;animation:fadeUp .45s both;transition:transform .25s,box-shadow .25s;
}
.card.open{z-index:30}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(79,70,229,.14)}
#list .card:nth-child(1){animation-delay:.05s}
#list .card:nth-child(2){animation-delay:.1s}
#list .card:nth-child(3){animation-delay:.15s}
#list .card:nth-child(4){animation-delay:.2s}
#list .card:nth-child(5){animation-delay:.25s}
#list .card:nth-child(6){animation-delay:.3s}
#list .card:nth-child(7){animation-delay:.35s}
#list .card:nth-child(8){animation-delay:.4s}
#list .card:nth-child(9){animation-delay:.45s}
#list .card:nth-child(10){animation-delay:.5s}
.daybar{padding:16px;display:flex;flex-direction:column;gap:10px}
.daybar .row{display:flex;gap:8px;align-items:center}
.daybar input[type=date]{flex:1;min-width:0}
.navbtn{
  padding:11px 14px;border:0;border-radius:12px;cursor:pointer;font-family:inherit;font-size:14px;
  font-weight:700;color:#fff;background:linear-gradient(135deg,var(--p1),var(--p2));white-space:nowrap;
  transition:transform .2s,filter .2s,box-shadow .2s;
}
.navbtn:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 10px 22px rgba(79,70,229,.35)}
.navbtn:active{transform:scale(.97)}
input,select{
  width:100%;padding:11px 12px;font-size:15px;font-family:inherit;color:var(--ink);
  border:1.5px solid var(--line);border-radius:12px;background:var(--surface2);outline:none;
  transition:border-color .25s,background .25s,box-shadow .25s,transform .2s;
}
input:focus{border-color:var(--p1);background:var(--surface);transform:translateY(-1px);box-shadow:0 0 0 4px rgba(79,70,229,.15)}
input[readonly]{opacity:.85;cursor:default}
input[type=date]{font-family:inherit;color-scheme:light}
[data-theme="dark"] input[type=date]{color-scheme:dark}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}

/* ===== القايمة المنسدلة ===== */
.dd{position:relative;width:100%}
.dd-btn{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:11px 14px;font-family:inherit;font-size:15px;font-weight:700;color:var(--ink);text-align:right;
  background:var(--surface2);border:1.5px solid var(--line);border-radius:14px;cursor:pointer;
  transition:border-color .25s,box-shadow .25s,background .25s,transform .2s;
}
.dd-btn:hover{border-color:#a5b4fc;box-shadow:0 6px 16px rgba(79,70,229,.12);transform:translateY(-1px)}
.dd.open .dd-btn{border-color:var(--p1);background:var(--surface);box-shadow:0 0 0 4px rgba(79,70,229,.15)}
.dd.empty .dd-label{color:var(--muted);font-weight:600}
.dd-chev{
  width:26px;height:26px;flex-shrink:0;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;font-size:13px;
  transition:transform .35s cubic-bezier(.2,.9,.3,1.2);
}
.dd.open .dd-chev{transform:rotate(180deg)}
.dd-menu{
  position:absolute;top:calc(100% + 6px);right:0;left:0;z-index:50;max-height:320px;overflow-y:auto;
  padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 18px 40px rgba(31,27,75,.22);
  opacity:0;transform:translateY(-8px) scale(.97);transform-origin:top center;pointer-events:none;
  transition:opacity .2s ease,transform .25s cubic-bezier(.2,.9,.3,1.2);
}
.dd.open .dd-menu{opacity:1;transform:none;pointer-events:auto}
.dd-item{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 12px;border-radius:10px;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;
  transition:background .2s,padding .2s,color .2s;
}
.dd-item:hover{background:linear-gradient(90deg,rgba(79,70,229,.14),rgba(124,58,237,.05));padding-right:18px}
.dd-item.sel{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff}
.dd-item.placeholder{color:var(--muted);font-weight:600}
.dd.open .dd-item{animation:ddIn .35s both;animation-delay:calc(var(--k) * 35ms)}
@keyframes ddIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
.dd-x{
  width:24px;height:24px;flex-shrink:0;border-radius:8px;display:grid;place-items:center;
  font-size:12px;color:var(--bad);background:rgba(239,68,68,.12);opacity:.8;transition:opacity .2s,background .2s,color .2s;
}
.dd-item:hover .dd-x{opacity:1}
.dd-x:hover{background:var(--bad);color:#fff}
.dd-add{display:flex;gap:6px;padding:8px 4px 4px;margin-top:6px;border-top:1px solid var(--line)}
.dd-add input{padding:8px 10px;font-size:14px;border-radius:10px}
.dd-addbtn{
  width:42px;flex-shrink:0;border:0;border-radius:10px;cursor:pointer;color:#fff;font-size:18px;font-weight:800;
  background:linear-gradient(135deg,var(--p1),var(--p2));transition:transform .2s,filter .2s;
}
.dd-addbtn:hover{transform:translateY(-1px);filter:brightness(1.1)}

#dLabel{font-family:'Cairo',Tahoma,Arial,sans-serif;font-weight:800;color:var(--p1);font-size:16px;animation:fadeUp .4s both}
#dStatus{font-size:13px;color:var(--muted);font-weight:700}
.head{display:flex;align-items:center;gap:8px;padding-left:12px}
.rep-head{
  flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;
  border:0;background:transparent;color:var(--ink);cursor:pointer;font-family:inherit;font-size:16px;font-weight:800;text-align:right;
  transition:background .2s,padding .2s;border-radius:18px 0 0 18px;
}
.rep-head:hover{background:rgba(79,70,229,.06);padding-right:22px}
.rep-name{font-family:'Cairo',Tahoma,Arial,sans-serif;font-size:16px;font-weight:700;letter-spacing:.2px}
.del{
  width:38px;height:38px;flex-shrink:0;border:0;border-radius:12px;cursor:pointer;font-size:16px;
  background:rgba(239,68,68,.14);transition:transform .2s,background .2s;
}
.del:hover{background:var(--bad);transform:scale(1.12) rotate(-8deg)}
.del:active{transform:scale(.92)}
.rate{
  font-size:13px;font-weight:700;color:#fff;background:linear-gradient(135deg,#6366f1,#a855f7);
  padding:5px 12px;border-radius:999px;white-space:nowrap;transition:transform .2s;
}
.rate:hover{transform:scale(1.06)}
.arrow{color:var(--p2);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:inline-block;margin-left:8px}
.card.open .arrow{transform:rotate(-90deg)}
.panel{display:none;padding:0 18px 18px;border-top:1px solid var(--line)}
.card.open .panel{display:block;animation:slideDown .3s ease}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.full{grid-column:1 / -1}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}

/* ===== الباقي ===== */
.rembox{
  width:100%;min-height:48px;padding:11px 14px;display:flex;align-items:center;justify-content:center;
  border-radius:14px;color:#fff;font-family:Consolas,'Courier New',monospace;font-size:18px;font-weight:800;
  background:linear-gradient(135deg,#f59e0b,#f97316,#fbbf24);background-size:200% 200%;
  box-shadow:0 8px 22px rgba(249,115,22,.45);
  animation:remShine 3s ease infinite,remGlow 2s ease-in-out infinite;
  position:relative;overflow:hidden;
}
.rembox::after{
  content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
  animation:remSweep 2.8s ease-in-out infinite;
}
.rembox.zero{
  background:linear-gradient(135deg,#059669,#10b981,#34d399);background-size:200% 200%;
  box-shadow:0 8px 22px rgba(16,185,129,.5);animation:remShine 3s ease infinite,remGlowOk 2s ease-in-out infinite;
}
.rembox.neg{
  background:linear-gradient(135deg,#dc2626,#f43f5e,#fb7185);background-size:200% 200%;
  box-shadow:0 8px 22px rgba(244,63,94,.5);animation:remShine 3s ease infinite,remGlowBad 1.4s ease-in-out infinite;
}
@keyframes remShine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes remGlow{0%,100%{box-shadow:0 8px 22px rgba(249,115,22,.45)}50%{box-shadow:0 10px 34px rgba(249,115,22,.9),0 0 0 4px rgba(251,191,36,.25)}}
@keyframes remGlowOk{0%,100%{box-shadow:0 8px 22px rgba(16,185,129,.5)}50%{box-shadow:0 10px 34px rgba(16,185,129,.95),0 0 0 4px rgba(52,211,153,.25)}}
@keyframes remGlowBad{0%,100%{box-shadow:0 8px 22px rgba(244,63,94,.5)}50%{box-shadow:0 10px 34px rgba(244,63,94,.95),0 0 0 4px rgba(251,113,133,.25)}}
@keyframes remSweep{0%{left:-60%}60%,100%{left:120%}}

.result{
  margin-top:16px;padding:14px 16px;border-radius:16px;color:#fff;font-weight:800;
  background:linear-gradient(135deg,#059669,#10b981,#14b8a6);display:flex;justify-content:space-between;align-items:center;
  box-shadow:0 8px 20px rgba(16,185,129,.25);
}
.result b{font-size:22px;font-family:Consolas,'Courier New',monospace;display:inline-block;animation:fadeUp .4s both}
.savebar{
  position:fixed;bottom:0;left:0;right:0;z-index:10;padding:12px 14px;background:var(--surface);
  border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.08);
}
.savebar button{
  width:100%;max-width:760px;margin:0 auto;display:block;padding:14px;border:0;border-radius:14px;cursor:pointer;
  font-family:inherit;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--p1),var(--p2),#ec4899);
  background-size:200% 200%;animation:shimmer 6s ease infinite;transition:transform .2s,filter .2s,box-shadow .2s;
}
.savebar button:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 10px 22px rgba(79,70,229,.35)}
.savebar button:active{transform:scale(.97)}
.savebar button:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;width:min(92vw,420px);display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:12px 14px;border-radius:12px;color:#fff;font-weight:700;font-size:14px;box-shadow:0 10px 24px rgba(0,0,0,.25);animation:toastIn .4s cubic-bezier(.2,.9,.3,1.2)}
.toast.ok{background:linear-gradient(135deg,#059669,#10b981)}
.toast.err{background:linear-gradient(135deg,#dc2626,#f97316)}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 0 3px rgba(255,255,255,.35),0 6px 18px rgba(249,115,22,.45)}50%{box-shadow:0 0 0 6px rgba(255,255,255,.15),0 10px 30px rgba(249,115,22,.85)}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes shimmer{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes personBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px) scale(1.06)}}
@keyframes personWave{0%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}100%{transform:rotate(0)}}

@media(max-width:560px){
  .grid{grid-template-columns:1fr 1fr}
  .pair{grid-template-columns:1fr}
  .daybar .row{flex-wrap:wrap}
  .daybar input[type=date]{flex:1 1 100%;order:-1}
  header h1{font-size:17px}
  .hbtn-hl{padding:0 12px;font-size:13px}
}
</style>
</head>
<body>

<header>
  <h1>حسابات المناديب</h1>
  <div class="hbtns">
    <a class="hbtn hbtn-tr" href="transfers.html"><span class="ico">💸</span> التحويلات</a>
    <a class="hbtn hbtn-hl" href="manage.html"><span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></span> المناديب</a>
    <button class="hbtn" onclick="toggleTheme()" title="تبديل الوضع">🌓</button>
  </div>
</header>

<div id="toasts"></div>

<main>
  <div class="card daybar">
    <div class="row">
      <button class="navbtn" onclick="shiftDay(1)">‹ التالي</button>
      <input type="date" id="dDate" onchange="goDate(this.value)">
      <button class="navbtn" onclick="shiftDay(-1)">السابق ›</button>
    </div>
    <div id="savedDaysWrap"></div>
    <div id="dLabel"></div>
    <div id="dStatus"></div>
  </div>

  <div id="list"></div>
</main>

<div class="savebar">
  <button id="btnSave" onclick="saveDay()">💾 حفظ اليوم</button>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwtdP1cSfohJVXLaJmOWcokwK9DJEJbAwUVSt1bG695tGMc5oAdmFJzbppo86mCPhw_/exec';

const BLANK = () => ({
  total: '', count: '', cash: '',
  insta: '', instaRecv: '',
  voda: '', vodaRecv: ''
});

let reps = [];
let recvList = [];
let state = {};
let openSet = new Set();
let currentDate = '';
let dirty = false;
let savedDaysList = [];

function rateOf(name) {
  const r = reps.find(x => x.name === name);
  return r ? r.rate : 27;
}

function ensureState() {
  reps.forEach(r => { if (!state[r.name]) state[r.name] = BLANK(); });
}

function resetState() {
  state = {};
  ensureState();
}

function call(action, params = {}) {
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    const qs = new URLSearchParams({ ...params, action, callback: cbName });
    const script = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('انتهت مهلة الاتصال، جرب تاني')); }, 20000);
    function cleanup() { clearTimeout(timer); delete window[cbName]; script.remove(); }
    window[cbName] = res => {
      cleanup();
      if (res && res.ok) resolve(res.data);
      else reject(new Error((res && res.error) || 'حصل خطأ'));
    };
    script.onerror = () => { cleanup(); reject(new Error('فشل الاتصال بالسيرفر، اتأكد من اللينك والنشر')); };
    script.src = API_URL + '?' + qs.toString();
    document.body.appendChild(script);
  });
}

function fmt(n) { return Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
function pad(n) { return String(n).padStart(2, '0'); }
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function addDays(iso, n) {
  const [y, m, d] = iso.split('-').map(Number);
  const x = new Date(y, m - 1, d + n);
  return x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate());
}
function dmy(iso) {
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[3] + '/' + m[2] + '/' + m[1] : esc(iso);
}
function sv(v) { return v ? String(v) : ''; }

// ---------- القايمة المنسدلة ----------

function ddHTML(opts, value, placeholder, extra = '') {
  const cur = value !== '' ? opts.find(o => o.v === value) : null;
  const label = cur ? cur.l : placeholder;
  return `<div class="dd${cur ? '' : ' empty'}" data-value="${esc(cur ? value : '')}" ${extra}>
    <button type="button" class="dd-btn"><span class="dd-label">${esc(label)}</span><span class="dd-chev">▾</span></button>
    <div class="dd-menu">${opts.map((o, k) =>
      `<div class="dd-item${cur && o.v === value ? ' sel' : ''}${o.v === '' ? ' placeholder' : ''}" data-v="${esc(o.v)}" style="--k:${k}"><span class="dd-t">${esc(o.l)}</span></div>`
    ).join('')}</div>
  </div>`;
}

function recvDdHTML(i, key, value) {
  const hasVal = value && recvList.includes(value);
  const label = hasVal ? value : '-- المستلم --';
  const items = recvList.map((n, k) =>
    `<div class="dd-item${n === value ? ' sel' : ''}" data-v="${esc(n)}" style="--k:${k + 1}">
       <span class="dd-t">${esc(n)}</span><span class="dd-x" title="امسح المستلم">✕</span>
     </div>`
  ).join('');
  return `<div class="dd${hasVal ? '' : ' empty'}" data-i="${i}" data-key="${key}" data-value="${esc(hasVal ? value : '')}">
    <button type="button" class="dd-btn"><span class="dd-label">${esc(label)}</span><span class="dd-chev">▾</span></button>
    <div class="dd-menu">
      <div class="dd-item placeholder" data-v="" style="--k:0"><span class="dd-t">-- المستلم --</span></div>
      ${items}
      <div class="dd-add">
        <input type="text" class="dd-new" placeholder="اسم مستلم جديد">
        <button type="button" class="dd-addbtn" title="إضافة">+</button>
      </div>
    </div>
  </div>`;
}

function setDdValue(id, v) {
  const root = document.getElementById(id);
  if (!root) return;
  const items = [...root.querySelectorAll('.dd-item')];
  const item = v !== '' ? items.find(x => x.dataset.v === v) : null;
  root.dataset.value = item ? v : '';
  root.querySelector('.dd-label').textContent = item ? item.textContent : items[0].textContent;
  root.classList.toggle('empty', !item);
  items.forEach(x => x.classList.toggle('sel', x === item));
}

function pickDd(item) {
  const root = item.closest('.dd');
  const v = item.dataset.v;
  const txt = (item.querySelector('.dd-t') || item).textContent;
  root.dataset.value = v;
  root.querySelector('.dd-label').textContent = txt;
  root.classList.toggle('empty', v === '');
  root.querySelectorAll('.dd-item').forEach(x => x.classList.toggle('sel', x === item && v !== ''));
  root.classList.remove('open');

  if (root.dataset.key) {
    const i = Number(root.dataset.i);
    state[reps[i].name][root.dataset.key] = v;
    dirty = true;
    updSummary(i);
  } else if (root.id === 'savedDays') {
    goDate(v);
  }
}

document.addEventListener('click', e => {
  const del = e.target.closest('.dd-x');
  if (del) { e.stopPropagation(); delRecv(del.closest('.dd-item').dataset.v); return; }

  const add = e.target.closest('.dd-addbtn');
  if (add) { addRecv(add.parentElement.querySelector('.dd-new').value); return; }

  const item = e.target.closest('.dd-item');
  if (item) { pickDd(item); return; }

  if (e.target.closest('.dd-menu')) return;

  const btn = e.target.closest('.dd-btn');
  const root = btn ? btn.closest('.dd') : null;
  const wasOpen = root && root.classList.contains('open');
  document.querySelectorAll('.dd.open').forEach(d => d.classList.remove('open'));
  if (root && !wasOpen) root.classList.add('open');
});

document.addEventListener('keydown', e => {
  if (e.target.classList && e.target.classList.contains('dd-new') && e.key === 'Enter') {
    e.preventDefault();
    addRecv(e.target.value);
  }
});

// ---------- حسابات ----------

function calcOf(name) {
  const s = state[name];
  const count = Number(s.count) || 0;
  const commission = count * rateOf(name);
  const total = Number(s.total) || 0;
  const net = total - commission;
  const paid = (Number(s.cash) || 0) + (Number(s.insta) || 0) + (Number(s.voda) || 0);
  return { commission: commission, net: net, rem: net - paid };
}

function remCls(v) {
  if (v < 0) return ' neg';
  if (v === 0) return ' zero';
  return '';
}

function toast(text, ok) {
  const t = document.createElement('div');
  t.className = 'toast ' + (ok ? 'ok' : 'err');
  t.textContent = text;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 4000);
}

function render() {
  const list = document.getElementById('list');
  list.innerHTML = reps.map((r, i) => {
    const name = r.name;
    const s = state[name];
    const c = calcOf(name);
    const open = openSet.has(i) ? ' open' : '';
    return `
    <div class="card${open}">
      <div class="head">
        <button class="rep-head" data-toggle="${i}">
          <span><span class="arrow">‹</span> <span class="rep-name">${esc(name)}</span></span>
          <span class="rate">عمولة الشحنة: ${r.rate}</span>
        </button>
        <button class="del" data-clear="${i}" title="مسح بيانات المندوب" aria-label="مسح بيانات المندوب">🗑️</button>
      </div>
      <div class="panel">
        <div class="grid">
          <div>
            <label>الإجمالي</label>
            <input type="number" inputmode="decimal" min="0" data-i="${i}" data-key="total" value="${sv(s.total)}">
          </div>
          <div>
            <label>عدد الشحنات</label>
            <input type="number" inputmode="numeric" min="0" data-i="${i}" data-key="count" value="${sv(s.count)}">
          </div>
          <div>
            <label>العمولة</label>
            <input type="text" id="comm-${i}" readonly value="${fmt(c.commission)}">
          </div>
          <div>
            <label>الباقي</label>
            <div class="rembox${remCls(c.rem)}" id="rem-${i}">${fmt(c.rem)}</div>
          </div>
          <div class="full">
            <label>المتحصل كاش</label>
            <input type="number" inputmode="decimal" min="0" data-i="${i}" data-key="cash" value="${sv(s.cash)}">
          </div>
          <div class="full">
            <label>انستاباي</label>
            <div class="pair">
              <input type="number" inputmode="decimal" min="0" placeholder="المبلغ" data-i="${i}" data-key="insta" value="${sv(s.insta)}">
              ${recvDdHTML(i, 'instaRecv', s.instaRecv)}
            </div>
          </div>
          <div class="full">
            <label>فودافون كاش</label>
            <div class="pair">
              <input type="number" inputmode="decimal" min="0" placeholder="المبلغ" data-i="${i}" data-key="voda" value="${sv(s.voda)}">
              ${recvDdHTML(i, 'vodaRecv', s.vodaRecv)}
            </div>
          </div>
        </div>
        <div class="result">
          <span>الإجمالي بعد خصم العمولة</span>
          <b id="net-${i}">${fmt(c.net)}</b>
        </div>
      </div>
    </div>`;
  }).join('');
}

function updSummary(i) {
  const name = reps[i].name;
  const c = calcOf(name);
  document.getElementById('comm-' + i).value = fmt(c.commission);
  document.getElementById('net-' + i).textContent = fmt(c.net);
  const rb = document.getElementById('rem-' + i);
  rb.textContent = fmt(c.rem);
  rb.className = 'rembox' + remCls(c.rem);
}

const listEl = document.getElementById('list');

listEl.addEventListener('click', e => {
  const clr = e.target.closest('[data-clear]');
  if (clr) { clearRep(Number(clr.dataset.clear)); return; }

  const b = e.target.closest('[data-toggle]');
  if (!b) return;
  const i = Number(b.dataset.toggle);
  const card = b.closest('.card');
  if (openSet.has(i)) openSet.delete(i); else openSet.add(i);
  card.classList.toggle('open');
});

listEl.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.i === undefined || !el.dataset.key) return;
  const i = Number(el.dataset.i);
  state[reps[i].name][el.dataset.key] = el.value;
  dirty = true;
  updSummary(i);
});

function renderSavedDays() {
  const opts = [{ v: '', l: '-- أيام محفوظة قبل كده --' }]
    .concat(savedDaysList.map(d => ({ v: d, l: dmy(d) })));
  const value = savedDaysList.includes(currentDate) ? currentDate : '';
  document.getElementById('savedDaysWrap').innerHTML =
    ddHTML(opts, value, '-- أيام محفوظة قبل كده --', 'id="savedDays"');
}

function setDateUI(date) {
  document.getElementById('dDate').value = date;
  document.getElementById('dLabel').textContent = 'حسابات يوم ' + dmy(date);
  setDdValue('savedDays', savedDaysList.includes(date) ? date : '');
}

function goDate(date) {
  if (!date) return;
  if (dirty && !confirm('فيه تعديلات مش متحفوظة، متأكد إنك عايز تغير اليوم؟')) {
    setDateUI(currentDate);
    return;
  }
  currentDate = date;
  setDateUI(date);
  loadDay();
}

function shiftDay(n) {
  goDate(addDays(currentDate || todayISO(), n));
}

// ---------- المستلمين ----------

async function loadRecv() {
  recvList = (await call('getReceivers')) || [];
}

async function addRecv(name) {
  name = String(name || '').trim();
  if (!name) return toast('اكتب اسم المستلم', false);
  try {
    await call('addReceiver', { name: name });
    toast('تم إضافة ' + name, true);
    await loadRecv();
    render();
  } catch (e) {
    toast(e.message, false);
  }
}

async function delRecv(name) {
  if (!confirm('متأكد إنك عايز تمسح ' + name + ' من قايمة المستلمين؟')) return;
  try {
    await call('deleteReceiver', { name: name });
    reps.forEach(r => {
      const s = state[r.name];
      if (!s) return;
      if (s.instaRecv === name) { s.instaRecv = ''; dirty = true; }
      if (s.vodaRecv === name) { s.vodaRecv = ''; dirty = true; }
    });
    toast('تم حذف ' + name, true);
    await loadRecv();
    render();
  } catch (e) {
    toast(e.message, false);
  }
}

// ---------- الأيام ----------

async function loadReps() {
  reps = (await call('getReps')) || [];
  ensureState();
}

async function loadDay() {
  const date = currentDate;
  const status = document.getElementById('dStatus');
  status.textContent = 'جاري التحميل...';
  resetState();
  try {
    const rows = await call('getDay', { date });
    if (date !== currentDate) return;
    if (rows === null) {
      status.textContent = 'مفيش بيانات محفوظة لليوم ده، ابدأ الإدخال';
    } else {
      status.textContent = 'اليوم ده محفوظ، تقدر تعدل وتحفظ تاني';
      rows.forEach(r => {
        if (!state[r.rep]) return;
        state[r.rep] = {
          total: sv(r.total), count: sv(r.count), cash: sv(r.cash),
          insta: sv(r.insta), instaRecv: r.instaRecv || '',
          voda: sv(r.voda), vodaRecv: r.vodaRecv || ''
        };
      });
    }
  } catch (e) {
    if (date !== currentDate) return;
    status.textContent = '';
    toast(e.message, false);
  }
  dirty = false;
  render();
}

async function refreshDays() {
  try {
    savedDaysList = (await call('listDays')) || [];
    renderSavedDays();
  } catch (e) {
    toast('تعذر تحميل قايمة الأيام: ' + e.message, false);
  }
}

async function persistDay() {
  const items = reps.map(r => {
    const name = r.name;
    const s = state[name];
    const c = calcOf(name);
    return {
      rep: name,
      total: Number(s.total) || 0,
      count: Number(s.count) || 0,
      commission: c.commission,
      cash: Number(s.cash) || 0,
      insta: Number(s.insta) || 0,
      instaRecv: s.instaRecv,
      voda: Number(s.voda) || 0,
      vodaRecv: s.vodaRecv
    };
  });
  await call('saveDay', { date: currentDate, data: JSON.stringify(items) });
  dirty = false;
  document.getElementById('dStatus').textContent = 'اتحفظ اليوم ده بنجاح';
  await refreshDays();
}

async function saveDay() {
  if (!currentDate) return toast('اختار يوم الأول', false);
  const btn = document.getElementById('btnSave');
  btn.disabled = true;
  btn.textContent = 'جاري الحفظ...';
  try {
    await persistDay();
    toast('تم حفظ يوم ' + dmy(currentDate), true);
  } catch (e) {
    toast(e.message, false);
  } finally {
    btn.disabled = false;
    btn.textContent = '💾 حفظ اليوم';
  }
}

async function clearRep(i) {
  const name = reps[i].name;
  if (!confirm('متأكد إنك عايز تمسح بيانات ' + name + ' لليوم ده؟\nهتتمسح من الشيت كمان.')) return;
  state[name] = BLANK();
  render();
  if (!currentDate) return;
  try {
    await persistDay();
    toast('اتمسحت بيانات ' + name, true);
  } catch (e) {
    dirty = true;
    toast(e.message, false);
  }
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
}

(async function init() {
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
  try {
    await loadReps();
    await loadRecv();
  } catch (e) {
    toast('تعذر تحميل البيانات: ' + e.message, false);
  }
  resetState();
  render();
  renderSavedDays();
  refreshDays();
  goDate(todayISO());
})();
</script>
</body>
</html>
