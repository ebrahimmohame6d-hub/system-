<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حسابات المناديب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
</head>
<body>

<header>
  <h1>حسابات المناديب</h1>
  <button class="hbtn theme" id="themeBtn" onclick="toggleTheme(this)" title="تبديل الوضع">🌙</button>
</header>

<div id="toasts"></div>

<div class="wrap">
  <aside class="side">
    <div class="side-title">القايمة</div>
    <a class="nav-item on" href="index.html"><span class="ni">📊</span> حسابات المناديب</a>
    <a class="nav-item" href="manage.html"><span class="ni">👥</span> المناديب</a>
    <a class="nav-item" href="transfers.html"><span class="ni">💸</span> التحويلات</a>
    <a class="nav-item" href="profit.html"><span class="ni">📈</span> أرباح الشركة</a>
    <a class="nav-item" href="weekly.html"><span class="ni">🗓️</span> حساب الأسبوعي</a>
    <a class="nav-item" href="gamiya.html"><span class="ni">🤝</span> الجمعية</a>
  </aside>

  <main class="content">
    <div class="card daybar">
      <div class="row">
        <button class="navbtn" onclick="shiftDay(1)">‹ التالي</button>
        <input type="date" id="dDate" onchange="goDate(this.value)">
        <button class="navbtn" onclick="shiftDay(-1)">السابق ›</button>
      </div>
      <div id="savedDaysWrap"></div>
      <div id="dLabel"></div>
      <div id="dStatus"></div>
    </div>

    <div id="list"></div>

    <div class="savebar">
      <button id="btnSave" onclick="saveDay()">💾 حفظ اليوم</button>
    </div>
  </main>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwtdP1cSfohJVXLaJmOWcokwK9DJEJbAwUVSt1bG695tGMc5oAdmFJzbppo86mCPhw_/exec';

let CO = [], OUT_CO = [], CN = {};
let reps = [], recvList = [], state = {}, openSet = new Set();
let currentDate = '', dirty = false, savedDaysList = [];
const $ = id => document.getElementById(id);

const BLANK = () => {
  const b = { total:'', cash:'', insta:'', instaRecv:'', voda:'', vodaRecv:'' };
  CO.forEach(k => { b['zi_' + k] = ''; });
  OUT_CO.forEach(k => { b['zo_' + k] = ''; });
  return b;
};
function repOf(n) { return reps.find(x => x.name === n) || { name: n, rate: 27, payType: 'daily' }; }
function rateOf(n) { return repOf(n).rate; }
function ensureState() { reps.forEach(r => { if (!state[r.name]) state[r.name] = BLANK(); }); }
function resetState() { state = {}; ensureState(); }

function call(action, params = {}) {
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    const qs = new URLSearchParams({ ...params, action, callback: cbName });
    const script = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('انتهت مهلة الاتصال، جرب تاني')); }, 20000);
    function cleanup() { clearTimeout(timer); delete window[cbName]; script.remove(); }
    window[cbName] = res => {
      cleanup();
      if (res && res.ok) resolve(res.data);
      else reject(new Error((res && res.error) || 'حصل خطأ'));
    };
    script.onerror = () => { cleanup(); reject(new Error('فشل الاتصال بالسيرفر، اتأكد من اللينك والنشر')); };
    script.src = API_URL + '?' + qs.toString();
    document.body.appendChild(script);
  });
}

function fmt(n) { return Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
function pad(n) { return String(n).padStart(2, '0'); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function addDays(iso, n) { const [y,m,d] = iso.split('-').map(Number); const x = new Date(y, m-1, d+n); return x.getFullYear() + '-' + pad(x.getMonth()+1) + '-' + pad(x.getDate()); }
function dmy(iso) { const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3]+'/'+m[2]+'/'+m[1] : esc(iso); }
function sv(v) { return v ? String(v) : ''; }

function toast(text, ok) {
  const t = document.createElement('div');
  t.className = 'toast ' + (ok ? 'ok' : 'err');
  t.textContent = text;
  $('toasts').appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 4000);
}

function paintThemeBtn(th) { const b = $('themeBtn'); if (b) b.textContent = th === 'dark' ? '☀️' : '🌙'; }
function toggleTheme(btn) {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  paintThemeBtn(next);
  if (btn) { btn.classList.remove('spin'); void btn.offsetWidth; btn.classList.add('spin'); }
}

// ---------- القايمة المنسدلة ----------
function ddHTML(opts, value, placeholder, extra = '') {
  const cur = value !== '' ? opts.find(o => o.v === value) : null;
  return `<div class="dd${cur ? '' : ' empty'}" data-value="${esc(cur ? value : '')}" ${extra}>
    <button type="button" class="dd-btn"><span class="dd-label">${esc(cur ? cur.l : placeholder)}</span><span class="dd-chev">▾</span></button>
    <div class="dd-menu">${opts.map((o, k) =>
      `<div class="dd-item${cur && o.v === value ? ' sel' : ''}${o.v === '' ? ' placeholder' : ''}" data-v="${esc(o.v)}" style="--k:${k}"><span class="dd-t">${esc(o.l)}</span></div>`
    ).join('')}</div></div>`;
}
function recvDdHTML(i, key, value) {
  const hasVal = value && recvList.includes(value);
  const items = recvList.map((n, k) =>
    `<div class="dd-item${n === value ? ' sel' : ''}" data-v="${esc(n)}" style="--k:${k + 1}"><span class="dd-t">${esc(n)}</span><span class="dd-x" title="امسح المستلم">✕</span></div>`
  ).join('');
  return `<div class="dd${hasVal ? '' : ' empty'}" data-i="${i}" data-key="${key}" data-value="${esc(hasVal ? value : '')}">
    <button type="button" class="dd-btn"><span class="dd-label">${esc(hasVal ? value : '-- المستلم --')}</span><span class="dd-chev">▾</span></button>
    <div class="dd-menu">
      <div class="dd-item placeholder" data-v="" style="--k:0"><span class="dd-t">-- المستلم --</span></div>
      ${items}
      <div class="dd-add"><input type="text" class="dd-new" placeholder="اسم مستلم جديد"><button type="button" class="dd-addbtn" title="إضافة">+</button></div>
    </div></div>`;
}
function setDdValue(id, v) {
  const root = $(id);
  if (!root) return;
  const items = [...root.querySelectorAll('.dd-item')];
  const item = v !== '' ? items.find(x => x.dataset.v === v) : null;
  root.dataset.value = item ? v : '';
  root.querySelector('.dd-label').textContent = item ? item.textContent : items[0].textContent;
  root.classList.toggle('empty', !item);
  items.forEach(x => x.classList.toggle('sel', x === item));
}
function pickDd(item) {
  const root = item.closest('.dd');
  const v = item.dataset.v;
  root.dataset.value = v;
  root.querySelector('.dd-label').textContent = (item.querySelector('.dd-t') || item).textContent;
  root.classList.toggle('empty', v === '');
  root.querySelectorAll('.dd-item').forEach(x => x.classList.toggle('sel', x === item && v !== ''));
  root.classList.remove('open');
  if (root.dataset.key) {
    const i = Number(root.dataset.i);
    state[reps[i].name][root.dataset.key] = v;
    dirty = true;
  } else if (root.id === 'savedDays') {
    goDate(v);
  }
}
document.addEventListener('click', e => {
  const del = e.target.closest('.dd-x');
  if (del) { e.stopPropagation(); delRecv(del.closest('.dd-item').dataset.v); return; }
  const add = e.target.closest('.dd-addbtn');
  if (add) { addRecv(add.parentElement.querySelector('.dd-new').value); return; }
  const item = e.target.closest('.dd-item');
  if (item) { pickDd(item); return; }
  if (e.target.closest('.dd-menu')) return;
  const btn = e.target.closest('.dd-btn');
  const root = btn ? btn.closest('.dd') : null;
  const wasOpen = root && root.classList.contains('open');
  document.querySelectorAll('.dd.open').forEach(d => d.classList.remove('open'));
  if (root && !wasOpen) root.classList.add('open');
});
document.addEventListener('keydown', e => {
  if (e.target.classList && e.target.classList.contains('dd-new') && e.key === 'Enter') { e.preventDefault(); addRecv(e.target.value); }
});

// ---------- الحسابات ----------
function zoneSum(s) {
  const inSum = CO.reduce((a, k) => a + (Number(s['zi_' + k]) || 0), 0);
  const outSum = OUT_CO.reduce((a, k) => a + (Number(s['zo_' + k]) || 0), 0);
  return inSum + outSum;
}
function calcOf(name) {
  const rep = repOf(name);
  const s = state[name];
  const count = zoneSum(s);
  const commission = count * rep.rate;
  const isWeekly = rep.payType === 'weekly';
  const totalVal = Number(s.total) || 0;
  const net = isWeekly ? totalVal : (totalVal - commission);
  const paid = (Number(s.cash) || 0) + (Number(s.insta) || 0) + (Number(s.voda) || 0);
  return { count, commission, net, rem: net - paid, isWeekly };
}
function remCls(v) { return v < 0 ? ' neg' : v === 0 ? ' zero' : ''; }
function zoneInputs(i, prefix) {
  const s = state[reps[i].name];
  const keys = prefix === 'zi' ? CO : OUT_CO;
  return keys.map(k => `<div><label>${esc(CN[k])}</label>
    <input type="number" inputmode="numeric" min="0" placeholder="0" data-i="${i}" data-key="${prefix}_${k}" value="${sv(s[prefix + '_' + k])}"></div>`).join('');
}
function netLabelText(c) {
  return c.isWeekly ? 'الإجمالي قبل خصم العمولة' : 'الإجمالي بعد خصم العمولة';
}

function render() {
  $('list').innerHTML = reps.map((r, i) => {
    const s = state[r.name];
    const c = calcOf(r.name);
    const wTag = c.isWeekly ? `<span class="badge" style="background:rgba(217,119,6,.16);color:#b45309">أسبوعي</span>` : '';
    return `
    <div class="card${openSet.has(i) ? ' open' : ''}">
      <div class="head">
        <button class="rep-head" data-toggle="${i}">
          <span><span class="arrow">‹</span> <span class="rep-name">${esc(r.name)}</span>${wTag}</span>
          <span class="rate">عمولة الشحنة: ${r.rate}</span>
        </button>
        <button class="del" data-clear="${i}" title="مسح بيانات المندوب">🗑️</button>
      </div>
      <div class="panel">
        <div class="grid">
          <div><label>الإجمالي</label><input type="number" inputmode="decimal" min="0" data-i="${i}" data-key="total" value="${sv(s.total)}"></div>
          <div><label>عدد الشحنات</label><input type="text" id="cnt-${i}" readonly value="${c.count}"></div>
          <div><label>${c.isWeekly ? 'العمولة (أسبوعي)' : 'العمولة'}</label><input type="text" id="comm-${i}" readonly value="${fmt(c.commission)}"></div>
          <div><label>الباقي</label><div class="rembox${remCls(c.rem)}" id="rem-${i}">${fmt(c.rem)}</div></div>
        </div>
        <div class="zone"><div class="zt">📍 داخل الزون</div><div class="g3">${zoneInputs(i, 'zi')}</div></div>
        <div class="zone out"><div class="zt">🚚 خارج الزون</div><div class="g3">${zoneInputs(i, 'zo')}</div></div>
        <div class="grid" style="margin-top:14px">
          <div class="full"><label>المتحصل كاش</label><input type="number" inputmode="decimal" min="0" data-i="${i}" data-key="cash" value="${sv(s.cash)}"></div>
          <div class="full"><label>انستاباي</label><div class="pair">
            <input type="number" inputmode="decimal" min="0" placeholder="المبلغ" data-i="${i}" data-key="insta" value="${sv(s.insta)}">
            ${recvDdHTML(i, 'instaRecv', s.instaRecv)}</div></div>
          <div class="full"><label>فودافون كاش</label><div class="pair">
            <input type="number" inputmode="decimal" min="0" placeholder="المبلغ" data-i="${i}" data-key="voda" value="${sv(s.voda)}">
            ${recvDdHTML(i, 'vodaRecv', s.vodaRecv)}</div></div>
        </div>
        <div class="result"><span id="netlbl-${i}">${netLabelText(c)}</span><b id="net-${i}">${fmt(c.net)}</b></div>
      </div>
    </div>`;
  }).join('');
}
function updSummary(i) {
  const c = calcOf(reps[i].name);
  $('cnt-' + i).value = c.count;
  $('comm-' + i).value = fmt(c.commission);
  $('netlbl-' + i).textContent = netLabelText(c);
  $('net-' + i).textContent = fmt(c.net);
  const rb = $('rem-' + i);
  rb.textContent = fmt(c.rem);
  rb.className = 'rembox' + remCls(c.rem);
}

const listEl = $('list');
listEl.addEventListener('click', e => {
  const clr = e.target.closest('[data-clear]');
  if (clr) { clearRep(Number(clr.dataset.clear)); return; }
  const b = e.target.closest('[data-toggle]');
  if (!b) return;
  const i = Number(b.dataset.toggle);
  if (openSet.has(i)) openSet.delete(i); else openSet.add(i);
  b.closest('.card').classList.toggle('open');
});
listEl.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.i === undefined || !el.dataset.key) return;
  const i = Number(el.dataset.i);
  state[reps[i].name][el.dataset.key] = el.value;
  dirty = true;
  updSummary(i);
});

// ---------- المستلمين ----------
async function loadRecv() { recvList = (await call('getReceivers')) || []; }
async function addRecv(name) {
  name = String(name || '').trim();
  if (!name) return toast('اكتب اسم المستلم', false);
  try { await call('addReceiver', { name }); toast('تم إضافة ' + name, true); await loadRecv(); render(); }
  catch (e) { toast(e.message, false); }
}
async function delRecv(name) {
  if (!confirm('متأكد إنك عايز تمسح ' + name + ' من قايمة المستلمين؟')) return;
  try {
    await call('deleteReceiver', { name });
    reps.forEach(r => {
      const s = state[r.name];
      if (!s) return;
      if (s.instaRecv === name) { s.instaRecv = ''; dirty = true; }
      if (s.vodaRecv === name) { s.vodaRecv = ''; dirty = true; }
    });
    toast('تم حذف ' + name, true);
    await loadRecv(); render();
  } catch (e) { toast(e.message, false); }
}

// ---------- الأيام ----------
function renderSavedDays() {
  const opts = [{ v: '', l: '-- أيام محفوظة قبل كده --' }].concat(savedDaysList.map(d => ({ v: d, l: dmy(d) })));
  const value = savedDaysList.includes(currentDate) ? currentDate : '';
  $('savedDaysWrap').innerHTML = ddHTML(opts, value, '-- أيام محفوظة قبل كده --', 'id="savedDays"');
}
function setDateUI(date) {
  $('dDate').value = date;
  $('dLabel').textContent = 'حسابات يوم ' + dmy(date);
  setDdValue('savedDays', savedDaysList.includes(date) ? date : '');
}
function goDate(date) {
  if (!date) return;
  if (dirty && !confirm('فيه تعديلات مش متحفوظة، متأكد إنك عايز تغير اليوم؟')) { setDateUI(currentDate); return; }
  currentDate = date;
  setDateUI(date);
  loadDay();
}
function shiftDay(n) { goDate(addDays(currentDate || todayISO(), n)); }

async function loadReps() { reps = (await call('getReps')) || []; ensureState(); }

async function loadDay() {
  const date = currentDate;
  const status = $('dStatus');
  status.textContent = 'جاري التحميل...';
  resetState();
  try {
    const rows = await call('getDay', { date });
    if (date !== currentDate) return;
    if (rows === null) {
      status.textContent = 'مفيش بيانات محفوظة لليوم ده، ابدأ الإدخال';
    } else {
      status.textContent = 'اليوم ده محفوظ، تقدر تعدل وتحفظ تاني';
      rows.forEach(r => {
        if (!state[r.rep]) return;
        const st = { total: sv(r.total), cash: sv(r.cash), insta: sv(r.insta), instaRecv: r.instaRecv || '', voda: sv(r.voda), vodaRecv: r.vodaRecv || '' };
        CO.forEach(k => { st['zi_' + k] = sv(r.zin && r.zin[k]); });
        OUT_CO.forEach(k => { st['zo_' + k] = sv(r.zout && r.zout[k]); });
        state[r.rep] = st;
      });
    }
  } catch (e) {
    if (date !== currentDate) return;
    status.textContent = '';
    toast(e.message, false);
  }
  dirty = false;
  render();
}

async function refreshDays() {
  try { savedDaysList = (await call('listDays')) || []; renderSavedDays(); }
  catch (e) { toast('تعذر تحميل قايمة الأيام: ' + e.message, false); }
}

async function persistDay() {
  const items = reps.map(r => {
    const s = state[r.name];
    const c = calcOf(r.name);
    const zin = {}, zout = {};
    CO.forEach(k => { zin[k] = Number(s['zi_' + k]) || 0; });
    OUT_CO.forEach(k => { zout[k] = Number(s['zo_' + k]) || 0; });
    return {
      rep: r.name, total: Number(s.total) || 0, count: c.count, commission: c.commission, rate: rateOf(r.name),
      payType: r.payType,
      cash: Number(s.cash) || 0, insta: Number(s.insta) || 0, instaRecv: s.instaRecv,
      voda: Number(s.voda) || 0, vodaRecv: s.vodaRecv, zin, zout
    };
  });
  await call('saveDay', { date: currentDate, data: JSON.stringify(items) });
  dirty = false;
  $('dStatus').textContent = 'اتحفظ اليوم ده بنجاح';
  await refreshDays();
}

async function saveDay() {
  if (!currentDate) return toast('اختار يوم الأول', false);
  const btn = $('btnSave');
  btn.disabled = true;
  btn.textContent = 'جاري الحفظ...';
  try { await persistDay(); toast('تم حفظ يوم ' + dmy(currentDate), true); }
  catch (e) { toast(e.message, false); }
  finally { btn.disabled = false; btn.textContent = '💾 حفظ اليوم'; }
}

async function clearRep(i) {
  const name = reps[i].name;
  if (!confirm('متأكد إنك عايز تمسح بيانات ' + name + ' لليوم ده؟\nهتتمسح من الشيت كمان.')) return;
  state[name] = BLANK();
  render();
  if (!currentDate) return;
  try { await persistDay(); toast('اتمسحت بيانات ' + name, true); }
  catch (e) { dirty = true; toast(e.message, false); }
}

(async function init() {
  const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = dark ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  paintThemeBtn(theme);
  try {
    const p = await call('getPrices');
    CO = p.keys;
    CN = p.names;
    OUT_CO = p.outKeys || CO.filter(k => p.prices && p.prices.outZone && p.prices.outZone[k] != null);
    await loadReps();
    await loadRecv();
  } catch (e) { toast('تعذر تحميل البيانات: ' + e.message, false); }
  resetState();
  render();
  renderSavedDays();
  refreshDays();
  goDate(todayISO());
})();
</script>
</body>
</html>
