<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حسابات المناديب اليومية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f8; --surface:#ffffff; --surface2:#f4f6fc; --ink:#1b2140; --muted:#5b6485; --line:#e3e7f3;
  --p1:#4f46e5; --p2:#7c3aed; --ok:#10b981; --bad:#ef4444; --warn:#f59e0b; --sky:#0ea5e9;
  --shadow:0 4px 18px rgba(79,70,229,.08);
  --mono:'Consolas','Courier New',monospace;
}
[data-theme="dark"]{
  --bg:#0d1125; --surface:#161b37; --surface2:#1d2346; --ink:#f1f3ff; --muted:#b4bde3; --line:#2a3160;
  --shadow:0 4px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{
  margin:0; font-family:'Cairo',Tahoma,Arial,sans-serif; background:var(--bg); color:var(--ink);
  padding-bottom:40px; transition:background .3s,color .3s;
}
header{
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  padding:16px 20px; color:#fff;
  background:linear-gradient(120deg,#4f46e5,#7c3aed,#0ea5e9);
  box-shadow:0 6px 24px rgba(79,70,229,.3);
}
header h1{margin:0; font-size:20px; font-weight:800}
.theme{
  width:40px; height:40px; border-radius:12px; border:0; cursor:pointer;
  background:rgba(255,255,255,.2); color:#fff; font-size:18px;
}
main{max-width:1100px; margin:20px auto; padding:0 14px}
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:16px;
  padding:18px; box-shadow:var(--shadow); margin-bottom:16px; overflow-x:auto;
}
.daybar{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.daybar input[type=date]{
  flex:1; min-width:170px; padding:11px 12px; font-size:15px; font-family:inherit;
  border:1.5px solid var(--line); border-radius:12px; background:var(--surface2); color:var(--ink);
}
.navbtn{
  padding:11px 16px; border:0; border-radius:12px; cursor:pointer; font-family:inherit; font-size:15px;
  font-weight:700; color:#fff; background:linear-gradient(135deg,var(--p1),var(--p2));
}
.navbtn:active{transform:scale(.97)}
#dLabel{font-weight:800; color:var(--p1); font-size:16px; margin-top:12px}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px}
.stat{
  color:#fff; border-radius:14px; padding:14px; font-size:13px; font-weight:700;
  display:flex; flex-direction:column; gap:6px; box-shadow:0 8px 20px rgba(0,0,0,.14);
}
.stat b{font-size:24px; font-weight:800}
.s-blue{background:linear-gradient(135deg,#4f46e5,#7c3aed)}
.s-green{background:linear-gradient(135deg,#059669,#10b981)}
.s-red{background:linear-gradient(135deg,#dc2626,#f97316)}
.s-amber{background:linear-gradient(135deg,#d97706,#fbbf24)}
.s-sky{background:linear-gradient(135deg,#0284c7,#38bdf8)}
h2{margin:0 0 12px; font-size:17px; font-weight:800}
table{width:100%; border-collapse:separate; border-spacing:0; font-size:14px}
th{background:var(--surface2); color:var(--muted); font-size:12.5px; font-weight:800; padding:10px 8px; text-align:right; white-space:nowrap}
td{padding:10px 8px; border-bottom:1px solid var(--line); text-align:right; font-weight:600; white-space:nowrap}
tr.tot td{background:var(--surface2); font-weight:800; border-bottom:0}
tr:hover td{background:rgba(79,70,229,.06)}
.pos{color:var(--bad); font-weight:800}
.zero{color:var(--ok); font-weight:800}
.muted{color:var(--muted); font-size:12px}
.loader{text-align:center; color:var(--muted); padding:24px; font-weight:700}
.err{padding:12px; border-radius:12px; background:rgba(239,68,68,.12); color:var(--bad); font-weight:700}
#toasts{position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:100; width:min(92vw,420px); display:flex; flex-direction:column; gap:8px; pointer-events:none}
.toast{padding:12px 14px; border-radius:12px; color:#fff; font-weight:700; font-size:14px; box-shadow:0 10px 24px rgba(0,0,0,.25)}
.toast.ok{background:linear-gradient(135deg,#059669,#10b981)}
.toast.err{background:linear-gradient(135deg,#dc2626,#f97316)}

/* الموبايل: الجدول يتحول لكروت */
@media(max-width:700px){
  header h1{font-size:17px}
  table.rt thead{display:none}
  table.rt, table.rt tbody, table.rt tr, table.rt td{display:block; width:100%}
  table.rt tr{background:var(--surface2); border:1px solid var(--line); border-radius:14px; padding:6px 12px; margin-bottom:10px}
  table.rt td{display:flex; justify-content:space-between; align-items:center; gap:10px; border:0; padding:7px 0; text-align:left; white-space:normal; font-size:14px}
  table.rt td+td{border-top:1px dashed var(--line)}
  table.rt td::before{content:attr(data-l); color:var(--muted); font-size:12.5px; font-weight:800}
  table.rt tr.tot{background:linear-gradient(90deg,rgba(79,70,229,.12),var(--surface2))}
}
</style>
</head>
<body>

<header>
  <h1>حسابات المناديب اليومية</h1>
  <button class="theme" onclick="toggleTheme()" title="تبديل الوضع">🌓</button>
</header>

<div id="toasts"></div>

<main>
  <div class="card">
    <div class="daybar">
      <button class="navbtn" onclick="shiftDay(1)">‹ اليوم التالي</button>
      <input type="date" id="dDate" onchange="load()">
      <button class="navbtn" onclick="shiftDay(-1)">اليوم اللي قبله ›</button>
    </div>
    <div id="dLabel"></div>
  </div>

  <div class="card">
    <div id="stats" class="stats"><div class="loader">جاري التحميل...</div></div>
  </div>

  <div class="card">
    <h2>حسابات كل مندوب</h2>
    <div id="tBox"><div class="loader">جاري التحميل...</div></div>
  </div>
</main>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwtdP1cSfohJVXLaJmOWcokwK9DJEJbAwUVSt1bG695tGMc5oAdmFJzbppo86mCPhw_/exec';
const LOADING = '<div class="loader">جاري التحميل...</div>';

let rows = [];

function call(action, params = {}) {
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    const qs = new URLSearchParams({ ...params, action, callback: cbName });
    const script = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('انتهت مهلة الاتصال، جرب تاني')); }, 20000);
    function cleanup() { clearTimeout(timer); delete window[cbName]; script.remove(); }
    window[cbName] = res => {
      cleanup();
      if (res && res.ok) resolve(res.data);
      else reject(new Error((res && res.error) || 'حصل خطأ'));
    };
    script.onerror = () => { cleanup(); reject(new Error('فشل الاتصال بالسيرفر، اتأكد من اللينك والنشر')); };
    script.src = API_URL + '?' + qs.toString();
    document.body.appendChild(script);
  });
}

function fmt(n) { return Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 }); }

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function pad(n) { return String(n).padStart(2, '0'); }

function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

function addDays(iso, n) {
  const [y, m, d] = iso.split('-').map(Number);
  const x = new Date(y, m - 1, d + n);
  return x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate());
}

function dmy(iso) {
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[3] + '/' + m[2] + '/' + m[1] : esc(iso);
}

function toast(text, ok) {
  const t = document.createElement('div');
  t.className = 'toast ' + (ok ? 'ok' : 'err');
  t.textContent = text;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

// جدول بيتحول لكروت على الموبايل
function tbl(headers, body, foot) {
  let h = '<div style="overflow-x:auto"><table class="rt"><thead><tr>' +
    headers.map(x => '<th>' + x + '</th>').join('') + '</tr></thead><tbody>';
  body.forEach(r => {
    h += '<tr>' + r.map((c, i) => '<td data-l="' + esc(headers[i]) + '">' + c + '</td>').join('') + '</tr>';
  });
  if (foot) {
    h += '<tr class="tot">' + foot.map((c, i) => '<td data-l="' + esc(headers[i]) + '">' + c + '</td>').join('') + '</tr>';
  }
  return h + '</tbody></table></div>';
}

function shiftDay(n) {
  const input = document.getElementById('dDate');
  input.value = addDays(input.value || todayISO(), n);
  load();
}

async function load() {
  const date = document.getElementById('dDate').value;
  if (!date) return;
  document.getElementById('dLabel').textContent = 'حسابات يوم ' + dmy(date);
  document.getElementById('tBox').innerHTML = LOADING;
  document.getElementById('stats').innerHTML = LOADING;
  try {
    rows = (await call('getDailyAccounts', { date })) || [];
    render();
  } catch (e) {
    document.getElementById('tBox').innerHTML = '<div class="err">خطأ: ' + esc(e.message) + '</div>';
    document.getElementById('stats').innerHTML = '';
  }
}

function render() {
  const sum = k => rows.reduce((s, b) => s + (Number(b[k]) || 0), 0);

  const totalBal = sum('balance');
  document.getElementById('stats').innerHTML = [
    ['الشحنات الناجحة', fmt(sum('ok')), 's-green'],
    ['العمولة', fmt(sum('commission')), 's-blue'],
    ['المحصّل اليوم', fmt(sum('collectedDay')), 's-sky'],
    ['المدفوع اليوم', fmt(sum('paidDay')), 's-amber'],
    ['المديونية الكلية', fmt(totalBal), totalBal > 0 ? 's-red' : 's-green']
  ].map(([l, v, c]) => '<div class="stat ' + c + '">' + l + '<b>' + v + '</b></div>').join('');

  const headers = ['المندوب', 'ناجح', 'مؤجل', 'متهرب', 'إلغاء', 'استبدال', 'استلام طرد',
    'العمولة', 'المحصّل اليوم', 'المدفوع اليوم', 'المديونية لحد اليوم'];

  const body = rows.map(b => [
    '<b>' + esc(b.rep) + '</b>',
    fmt(b.ok),
    fmt(b.postponed),
    fmt(b.escaped),
    fmt(b.cancelled),
    fmt(b.replaced),
    fmt(b.received),
    fmt(b.commission) + ' <span class="muted">(' + b.rate + ' للشحنة)</span>',
    fmt(b.collectedDay),
    fmt(b.paidDay),
    '<span class="' + (b.balance > 0 ? 'pos' : 'zero') + '">' + fmt(b.balance) + '</span>'
  ]);

  const foot = [
    'الإجمالي',
    fmt(sum('ok')), fmt(sum('postponed')), fmt(sum('escaped')), fmt(sum('cancelled')),
    fmt(sum('replaced')), fmt(sum('received')), fmt(sum('commission')),
    fmt(sum('collectedDay')), fmt(sum('paidDay')),
    '<span class="' + (totalBal > 0 ? 'pos' : 'zero') + '">' + fmt(totalBal) + '</span>'
  ];

  document.getElementById('tBox').innerHTML = rows.length
    ? tbl(headers, body, foot)
    : '<div class="loader">مفيش بيانات لليوم ده</div>';
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
}

(function init() {
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
  document.getElementById('dDate').value = todayISO();
  load();
})();
</script>
</body>
</html>
