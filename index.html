<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حسابات المناديب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f8; --surface:#ffffff; --surface2:#f4f6fc; --ink:#1b2140; --muted:#5b6485; --line:#e3e7f3;
  --p1:#4f46e5; --p2:#7c3aed; --ok:#10b981; --bad:#ef4444;
  --shadow:0 4px 18px rgba(79,70,229,.08);
}
[data-theme="dark"]{
  --bg:#0d1125; --surface:#161b37; --surface2:#1d2346; --ink:#f1f3ff; --muted:#b4bde3; --line:#2a3160;
  --shadow:0 4px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:90px;transition:background .3s,color .3s}
header{
  display:flex;align-items:center;justify-content:space-between;padding:16px 20px;color:#fff;
  background:linear-gradient(120deg,#4f46e5,#7c3aed,#0ea5e9);box-shadow:0 6px 24px rgba(79,70,229,.3);
}
header h1{margin:0;font-size:20px;font-weight:800}
.theme{width:40px;height:40px;border-radius:12px;border:0;cursor:pointer;background:rgba(255,255,255,.2);color:#fff;font-size:18px}
main{max-width:760px;margin:20px auto;padding:0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.daybar{padding:16px;display:flex;flex-direction:column;gap:10px}
.daybar .row{display:flex;gap:8px;align-items:center}
.daybar input[type=date]{flex:1;min-width:0}
.navbtn{
  padding:11px 14px;border:0;border-radius:12px;cursor:pointer;font-family:inherit;font-size:14px;
  font-weight:700;color:#fff;background:linear-gradient(135deg,var(--p1),var(--p2));white-space:nowrap;
}
.navbtn:active{transform:scale(.97)}
input,select{
  width:100%;padding:11px 12px;font-size:15px;font-family:inherit;color:var(--ink);
  border:1.5px solid var(--line);border-radius:12px;background:var(--surface2);outline:none;
}
input:focus,select:focus{border-color:var(--p1);background:var(--surface)}
input[readonly]{opacity:.85;cursor:default}
#dLabel{font-weight:800;color:var(--p1);font-size:15px}
#dStatus{font-size:13px;color:var(--muted);font-weight:700}
.head{display:flex;align-items:center;gap:8px;padding-left:12px}
.rep-head{
  flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;
  border:0;background:transparent;color:var(--ink);cursor:pointer;font-family:inherit;font-size:16px;font-weight:800;text-align:right;
}
.rep-head:hover{background:rgba(79,70,229,.06)}
.del{
  width:38px;height:38px;flex-shrink:0;border:0;border-radius:10px;cursor:pointer;font-size:16px;
  background:rgba(239,68,68,.14);transition:background .2s;
}
.del:hover{background:var(--bad)}
.rate{font-size:13px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--p1),var(--p2));padding:5px 12px;border-radius:999px;white-space:nowrap}
.arrow{color:var(--muted);transition:transform .2s;display:inline-block;margin-left:8px}
.card.open .arrow{transform:rotate(-90deg)}
.panel{display:none;padding:0 18px 18px;border-top:1px solid var(--line)}
.card.open .panel{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:14px}
.full{grid-column:1 / -1}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:5px}
.result{
  margin-top:16px;padding:14px;border-radius:14px;color:#fff;font-weight:800;
  background:linear-gradient(135deg,#059669,#10b981);display:flex;justify-content:space-between;align-items:center;
}
.result b{font-size:22px;font-family:Consolas,'Courier New',monospace}
.addbox{padding:16px;display:grid;grid-template-columns:1fr 110px auto;gap:10px;align-items:end}
.addbox button{
  padding:12px 16px;border:0;border-radius:12px;cursor:pointer;font-family:inherit;font-size:15px;font-weight:700;
  color:#fff;background:linear-gradient(135deg,var(--p1),var(--p2));white-space:nowrap;
}
.addbox button:disabled{opacity:.6;cursor:not-allowed}
.savebar{
  position:fixed;bottom:0;left:0;right:0;padding:12px 14px;background:var(--surface);
  border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.08);
}
.savebar button{
  width:100%;max-width:760px;margin:0 auto;display:block;padding:14px;border:0;border-radius:12px;cursor:pointer;
  font-family:inherit;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--p1),var(--p2));
}
.savebar button:disabled{opacity:.6;cursor:not-allowed}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;width:min(92vw,420px);display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:12px 14px;border-radius:12px;color:#fff;font-weight:700;font-size:14px;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.toast.ok{background:linear-gradient(135deg,#059669,#10b981)}
.toast.err{background:linear-gradient(135deg,#dc2626,#f97316)}
@media(max-width:560px){
  .grid{grid-template-columns:1fr}
  .pair{grid-template-columns:1fr}
  .addbox{grid-template-columns:1fr}
  .daybar .row{flex-wrap:wrap}
  .daybar input[type=date]{flex:1 1 100%;order:-1}
}
</style>
</head>
<body>

<header>
  <h1>حسابات المناديب</h1>
  <button class="theme" onclick="toggleTheme()" title="تبديل الوضع">🌓</button>
</header>

<div id="toasts"></div>

<main>
  <div class="card daybar">
    <div class="row">
      <button class="navbtn" onclick="shiftDay(1)">‹ التالي</button>
      <input type="date" id="dDate" onchange="goDate(this.value)">
      <button class="navbtn" onclick="shiftDay(-1)">السابق ›</button>
    </div>
    <select id="savedDays" onchange="goDate(this.value)">
      <option value="">-- أيام محفوظة قبل كده --</option>
    </select>
    <div id="dLabel"></div>
    <div id="dStatus"></div>
  </div>

  <div id="list"></div>

  <div class="card">
    <div class="addbox">
      <div>
        <label>اسم المندوب الجديد</label>
        <input type="text" id="newName" placeholder="اكتب الاسم">
      </div>
      <div>
        <label>العمولة</label>
        <input type="number" id="newRate" value="27" min="1">
      </div>
      <button id="btnAddRep" onclick="addRep()">➕ إضافة مندوب</button>
    </div>
  </div>
</main>

<div class="savebar">
  <button id="btnSave" onclick="saveDay()">💾 حفظ اليوم</button>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwtdP1cSfohJVXLaJmOWcokwK9DJEJbAwUVSt1bG695tGMc5oAdmFJzbppo86mCPhw_/exec';

const RECEIVERS = ['Ahmed', 'Ibrahim'];
const BLANK = () => ({
  total: '', count: '', cash: '',
  insta: '', instaRecv: '',
  voda: '', vodaRecv: ''
});

let reps = [];
let state = {};
let openSet = new Set();
let currentDate = '';
let dirty = false;
let savedDaysList = [];

function rateOf(name) {
  const r = reps.find(x => x.name === name);
  return r ? r.rate : 27;
}

function ensureState() {
  reps.forEach(r => { if (!state[r.name]) state[r.name] = BLANK(); });
}

function resetState() {
  state = {};
  ensureState();
}

function call(action, params = {}) {
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    const qs = new URLSearchParams({ ...params, action, callback: cbName });
    const script = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('انتهت مهلة الاتصال، جرب تاني')); }, 20000);
    function cleanup() { clearTimeout(timer); delete window[cbName]; script.remove(); }
    window[cbName] = res => {
      cleanup();
      if (res && res.ok) resolve(res.data);
      else reject(new Error((res && res.error) || 'حصل خطأ'));
    };
    script.onerror = () => { cleanup(); reject(new Error('فشل الاتصال بالسيرفر، اتأكد من اللينك والنشر')); };
    script.src = API_URL + '?' + qs.toString();
    document.body.appendChild(script);
  });
}

function fmt(n) { return Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
function pad(n) { return String(n).padStart(2, '0'); }
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function addDays(iso, n) {
  const [y, m, d] = iso.split('-').map(Number);
  const x = new Date(y, m - 1, d + n);
  return x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate());
}
function dmy(iso) {
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[3] + '/' + m[2] + '/' + m[1] : esc(iso);
}
function sv(v) { return v ? String(v) : ''; }

function calcOf(name) {
  const s = state[name];
  const count = Number(s.count) || 0;
  const commission = count * rateOf(name);
  const total = Number(s.total) || 0;
  return { commission: commission, net: total - commission };
}

function recvOptions(cur) {
  return '<option value="">-- المستلم --</option>' +
    RECEIVERS.map(r => '<option value="' + r + '"' + (cur === r ? ' selected' : '') + '>' + r + '</option>').join('');
}

function toast(text, ok) {
  const t = document.createElement('div');
  t.className = 'toast ' + (ok ? 'ok' : 'err');
  t.textContent = text;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

function render() {
  const list = document.getElementById('list');
  list.innerHTML = reps.map((r, i) => {
    const name = r.name;
    const s = state[name];
    const c = calcOf(name);
    const open = openSet.has(i) ? ' open' : '';
    return `
    <div class="card${open}">
      <div class="head">
        <button class="rep-head" data-toggle="${i}">
          <span><span class="arrow">‹</span> ${esc(name)}</span>
          <span class="rate">عمولة الشحنة: ${r.rate}</span>
        </button>
        <button class="del" data-clear="${i}" title="مسح بيانات المندوب" aria-label="مسح بيانات المندوب">🗑️</button>
      </div>
      <div class="panel">
        <div class="grid">
          <div>
            <label>الإجمالي</label>
            <input type="number" inputmode="decimal" min="0" data-i="${i}" data-key="total" value="${sv(s.total)}">
          </div>
          <div>
            <label>عدد الشحنات</label>
            <input type="number" inputmode="numeric" min="0" data-i="${i}" data-key="count" value="${sv(s.count)}">
          </div>
          <div>
            <label>العمولة</label>
            <input type="text" id="comm-${i}" readonly value="${fmt(c.commission)}">
          </div>
          <div class="full">
            <label>المتحصل كاش</label>
            <input type="number" inputmode="decimal" min="0" data-i="${i}" data-key="cash" value="${sv(s.cash)}">
          </div>
          <div class="full">
            <label>انستاباي</label>
            <div class="pair">
              <input type="number" inputmode="decimal" min="0" placeholder="المبلغ"
                data-i="${i}" data-key="insta" value="${sv(s.insta)}">
              <select data-i="${i}" data-key="instaRecv">${recvOptions(s.instaRecv)}</select>
            </div>
          </div>
          <div class="full">
            <label>فودافون كاش</label>
            <div class="pair">
              <input type="number" inputmode="decimal" min="0" placeholder="المبلغ"
                data-i="${i}" data-key="voda" value="${sv(s.voda)}">
              <select data-i="${i}" data-key="vodaRecv">${recvOptions(s.vodaRecv)}</select>
            </div>
          </div>
        </div>
        <div class="result">
          <span>الإجمالي بعد خصم العمولة</span>
          <b id="net-${i}">${fmt(c.net)}</b>
        </div>
      </div>
    </div>`;
  }).join('');
}

function updSummary(i) {
  const name = reps[i].name;
  const c = calcOf(name);
  document.getElementById('comm-' + i).value = fmt(c.commission);
  document.getElementById('net-' + i).textContent = fmt(c.net);
}

const listEl = document.getElementById('list');

listEl.addEventListener('click', e => {
  const clr = e.target.closest('[data-clear]');
  if (clr) { clearRep(Number(clr.dataset.clear)); return; }

  const b = e.target.closest('[data-toggle]');
  if (!b) return;
  const i = Number(b.dataset.toggle);
  const card = b.closest('.card');
  if (openSet.has(i)) openSet.delete(i); else openSet.add(i);
  card.classList.toggle('open');
});

function onField(e) {
  const el = e.target;
  if (el.dataset.i === undefined) return;
  const i = Number(el.dataset.i);
  state[reps[i].name][el.dataset.key] = el.value;
  dirty = true;
  if (el.dataset.key === 'count' || el.dataset.key === 'total') updSummary(i);
}
listEl.addEventListener('input', onField);
listEl.addEventListener('change', onField);

function setDateUI(date) {
  document.getElementById('dDate').value = date;
  document.getElementById('dLabel').textContent = 'حسابات يوم ' + dmy(date);
  document.getElementById('savedDays').value = savedDaysList.includes(date) ? date : '';
}

function goDate(date) {
  if (!date) return;
  if (dirty && !confirm('فيه تعديلات مش متحفوظة، متأكد إنك عايز تغير اليوم؟')) {
    setDateUI(currentDate);
    return;
  }
  currentDate = date;
  setDateUI(date);
  loadDay();
}

function shiftDay(n) {
  goDate(addDays(currentDate || todayISO(), n));
}

async function loadReps() {
  reps = (await call('getReps')) || [];
  ensureState();
}

async function loadDay() {
  const date = currentDate;
  const status = document.getElementById('dStatus');
  status.textContent = 'جاري التحميل...';
  resetState();
  try {
    const rows = await call('getDay', { date });
    if (date !== currentDate) return;
    if (rows === null) {
      status.textContent = 'مفيش بيانات محفوظة لليوم ده، ابدأ الإدخال';
    } else {
      status.textContent = 'اليوم ده محفوظ، تقدر تعدل وتحفظ تاني';
      rows.forEach(r => {
        if (!state[r.rep]) return;
        state[r.rep] = {
          total: sv(r.total), count: sv(r.count), cash: sv(r.cash),
          insta: sv(r.insta), instaRecv: r.instaRecv || '',
          voda: sv(r.voda), vodaRecv: r.vodaRecv || ''
        };
      });
    }
  } catch (e) {
    if (date !== currentDate) return;
    status.textContent = '';
    toast(e.message, false);
  }
  dirty = false;
  render();
}

async function refreshDays() {
  try {
    savedDaysList = (await call('listDays')) || [];
    const sel = document.getElementById('savedDays');
    sel.innerHTML = '<option value="">-- أيام محفوظة قبل كده --</option>' +
      savedDaysList.map(d => '<option value="' + d + '">' + dmy(d) + '</option>').join('');
    sel.value = savedDaysList.includes(currentDate) ? currentDate : '';
  } catch (e) {
    toast('تعذر تحميل قايمة الأيام: ' + e.message, false);
  }
}

async function persistDay() {
  const items = reps.map(r => {
    const name = r.name;
    const s = state[name];
    const c = calcOf(name);
    return {
      rep: name,
      total: Number(s.total) || 0,
      count: Number(s.count) || 0,
      commission: c.commission,
      cash: Number(s.cash) || 0,
      insta: Number(s.insta) || 0,
      instaRecv: s.instaRecv,
      voda: Number(s.voda) || 0,
      vodaRecv: s.vodaRecv
    };
  });
  await call('saveDay', { date: currentDate, data: JSON.stringify(items) });
  dirty = false;
  document.getElementById('dStatus').textContent = 'اتحفظ اليوم ده بنجاح';
  await refreshDays();
}

async function saveDay() {
  if (!currentDate) return toast('اختار يوم الأول', false);
  const btn = document.getElementById('btnSave');
  btn.disabled = true;
  btn.textContent = 'جاري الحفظ...';
  try {
    await persistDay();
    toast('تم حفظ يوم ' + dmy(currentDate), true);
  } catch (e) {
    toast(e.message, false);
  } finally {
    btn.disabled = false;
    btn.textContent = '💾 حفظ اليوم';
  }
}

async function clearRep(i) {
  const name = reps[i].name;
  if (!confirm('متأكد إنك عايز تمسح بيانات ' + name + ' لليوم ده؟\nهتتمسح من الشيت كمان.')) return;
  state[name] = BLANK();
  render();
  if (!currentDate) return;
  try {
    await persistDay();
    toast('اتمسحت بيانات ' + name, true);
  } catch (e) {
    dirty = true;
    toast(e.message, false);
  }
}

async function addRep() {
  const nameEl = document.getElementById('newName');
  const rateEl = document.getElementById('newRate');
  const name = nameEl.value.trim();
  const rate = Number(rateEl.value);
  if (!name) return toast('اكتب اسم المندوب', false);
  if (!(rate > 0)) return toast('اكتب العمولة', false);

  const btn = document.getElementById('btnAddRep');
  btn.disabled = true;
  try {
    await call('addRep', { name: name, rate: rate });
    await loadReps();
    nameEl.value = '';
    rateEl.value = '27';
    render();
    if (currentDate) await persistDay();
    toast('تم إضافة ' + name, true);
  } catch (e) {
    toast(e.message, false);
  } finally {
    btn.disabled = false;
  }
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
}

(async function init() {
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
  try {
    await loadReps();
  } catch (e) {
    toast('تعذر تحميل المناديب: ' + e.message, false);
  }
  resetState();
  render();
  refreshDays();
  goDate(todayISO());
})();
</script>
</body>
</html>
