<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التحويلات والتحصيلات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
</head>
<body>

<header>
  <h1>💸 التحويلات</h1>
  <button class="hbtn theme" id="themeBtn" onclick="toggleTheme(this)" title="تبديل الوضع">🌙</button>
</header>

<div id="toasts"></div>

<div class="wrap">
  <aside class="side">
    <div class="side-title">القايمة</div>
    <a class="nav-item" href="index.html"><span class="ni">📊</span> حسابات المناديب</a>
    <a class="nav-item" href="manage.html"><span class="ni">👥</span> المناديب</a>
    <a class="nav-item on" href="transfers.html"><span class="ni">💸</span> التحويلات</a>
    <a class="nav-item" href="profit.html"><span class="ni">📈</span> أرباح الشركة</a>
    <a class="nav-item" href="weekly.html"><span class="ni">🗓️</span> حساب الأسبوعي</a>
    <a class="nav-item" href="gamiya.html"><span class="ni">🤝</span> الجمعية</a>
  </aside>

  <main class="content">
    <div class="card">
      <div class="ctrl" style="justify-content:space-between;margin-bottom:12px">
        <div class="seg">
          <button type="button" id="mDay" class="on" onclick="setMode('day')">يوم واحد</button>
          <button type="button" id="mRange" onclick="setMode('range')">فترة زمنية</button>
        </div>
        <div id="recvFilterWrap" style="min-width:190px"></div>
      </div>

      <div id="dayControls" class="daybar">
        <div class="row">
          <button type="button" class="navbtn" onclick="shiftDay(1)">‹ التالي</button>
          <input type="date" id="dDate" onchange="loadData()">
          <button type="button" class="navbtn" onclick="shiftDay(-1)">السابق ›</button>
        </div>
        <div id="savedDaysWrap"></div>
      </div>

      <div id="rangeControls" class="formrow" style="display:none;grid-template-columns:1fr 1fr auto">
        <div>
          <label>من تاريخ</label>
          <input type="date" id="fromDate">
        </div>
        <div>
          <label>إلى تاريخ</label>
          <input type="date" id="toDate">
        </div>
        <button type="button" class="btn" onclick="loadData()">عرض</button>
      </div>
    </div>

    <div class="card">
      <div class="stats">
        <div class="stat s-cash">الكاش<b id="stCash">0</b></div>
        <div class="stat s-insta">انستاباي<b id="stInsta">0</b></div>
        <div class="stat s-voda">فودافون كاش<b id="stVoda">0</b></div>
        <div class="stat s-all">إجمالي المتحصل<b id="stAll">0</b></div>
      </div>
    </div>

    <div class="card">
      <h2 class="sec">توزيع التحويلات على المستلمين</h2>
      <div class="tbl-box">
        <div class="tscroll">
          <table>
            <thead>
              <tr>
                <th>المستلم</th>
                <th>انستاباي</th>
                <th>فودافون كاش</th>
                <th>الإجمالي</th>
              </tr>
            </thead>
            <tbody id="recvBody">
              <tr><td colspan="4" class="muted">جاري التحميل...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="card">
      <h2 class="sec">تفاصيل تحصيلات المناديب</h2>
      <div class="tbl-box">
        <div class="tscroll">
          <table>
            <thead id="detHead"></thead>
            <tbody id="detBody">
              <tr><td colspan="5" class="muted">جاري التحميل...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwtdP1cSfohJVXLaJmOWcokwK9DJEJbAwUVSt1bG695tGMc5oAdmFJzbppo86mCPhw_/exec';

let mode = 'day';
let savedDaysList = [];
let loadedEntries = [];
const $ = id => document.getElementById(id);

function call(action, params = {}) {
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    const qs = new URLSearchParams({ ...params, action, callback: cbName });
    const script = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('انتهت مهلة الاتصال، جرب تاني')); }, 20000);
    function cleanup() { clearTimeout(timer); delete window[cbName]; script.remove(); }
    window[cbName] = res => {
      cleanup();
      if (res && res.ok) resolve(res.data);
      else reject(new Error((res && res.error) || 'حصل خطأ'));
    };
    script.onerror = () => { cleanup(); reject(new Error('فشل الاتصال بالسيرفر')); };
    script.src = API_URL + '?' + qs.toString();
    document.body.appendChild(script);
  });
}

function fmt(n) { return Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
function pad(n) { return String(n).padStart(2, '0'); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function addDays(iso, n) { const [y,m,d] = iso.split('-').map(Number); const x = new Date(y, m-1, d+n); return x.getFullYear() + '-' + pad(x.getMonth()+1) + '-' + pad(x.getDate()); }
function dmy(iso) { const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3]+'/'+m[2]+'/'+m[1] : esc(iso); }

function paintThemeBtn(th) { const b = $('themeBtn'); if (b) b.textContent = th === 'dark' ? '☀️' : '🌙'; }
function toggleTheme(btn) {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  paintThemeBtn(next);
  if (btn) { btn.classList.remove('spin'); void btn.offsetWidth; btn.classList.add('spin'); }
}
function toast(text, ok) {
  const t = document.createElement('div');
  t.className = 'toast ' + (ok ? 'ok' : 'err');
  t.textContent = text;
  $('toasts').appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 4000);
}

function ddHTML(opts, value, placeholder, extra = '') {
  const cur = value !== '' ? opts.find(o => o.v === value) : null;
  return `<div class="dd${cur ? '' : ' empty'}" data-value="${esc(cur ? value : '')}" ${extra}>
    <button type="button" class="dd-btn"><span class="dd-label">${esc(cur ? cur.l : placeholder)}</span><span class="dd-chev">▾</span></button>
    <div class="dd-menu">${opts.map((o, k) =>
      `<div class="dd-item${cur && o.v === value ? ' sel' : ''}${o.v === '' ? ' placeholder' : ''}" data-v="${esc(o.v)}" style="--k:${k}"><span class="dd-t">${esc(o.l)}</span></div>`
    ).join('')}</div></div>`;
}

document.addEventListener('click', e => {
  const item = e.target.closest('.dd-item');
  if (item) {
    const root = item.closest('.dd');
    const v = item.dataset.v;
    root.dataset.value = v;
    root.querySelector('.dd-label').textContent = (item.querySelector('.dd-t') || item).textContent;
    root.classList.toggle('empty', v === '');
    root.querySelectorAll('.dd-item').forEach(x => x.classList.toggle('sel', x === item && v !== ''));
    root.classList.remove('open');
    if (root.id === 'recvFilter') renderData();
    else if (root.id === 'savedDays' && v) { $('dDate').value = v; loadData(); }
    return;
  }
  if (e.target.closest('.dd-menu')) return;
  const btn = e.target.closest('.dd-btn');
  const root = btn ? btn.closest('.dd') : null;
  const wasOpen = root && root.classList.contains('open');
  document.querySelectorAll('.dd.open').forEach(d => d.classList.remove('open'));
  if (root && !wasOpen) root.classList.add('open');
});

function renderSavedDays() {
  const cur = $('dDate').value;
  const opts = [{ v: '', l: '-- أيام محفوظة قبل كده --' }].concat(savedDaysList.map(d => ({ v: d, l: dmy(d) })));
  $('savedDaysWrap').innerHTML = ddHTML(opts, savedDaysList.includes(cur) ? cur : '', '-- أيام محفوظة قبل كده --', 'id="savedDays"');
}

function setMode(m) {
  mode = m;
  $('mDay').classList.toggle('on', m === 'day');
  $('mRange').classList.toggle('on', m === 'range');
  $('dayControls').style.display = m === 'day' ? '' : 'none';
  $('rangeControls').style.display = m === 'range' ? 'grid' : 'none';
  loadData();
}

function shiftDay(n) {
  $('dDate').value = addDays($('dDate').value || todayISO(), n);
  loadData();
}

async function loadData() {
  $('recvBody').innerHTML = '<tr><td colspan="4" class="muted">جاري التحميل...</td></tr>';
  $('detBody').innerHTML = '<tr><td colspan="5" class="muted">جاري التحميل...</td></tr>';
  loadedEntries = [];

  try {
    if (mode === 'day') {
      const date = $('dDate').value || todayISO();
      renderSavedDays();
      const rows = (await call('getDay', { date })) || [];
      rows.forEach(r => loadedEntries.push({ date, ...r }));
    } else {
      const from = $('fromDate').value;
      const to = $('toDate').value;
      if (!from || !to) return toast('اختار تاريخ البداية والنهاية', false);
      const targets = savedDaysList.filter(d => d >= from && d <= to);
      const results = await Promise.all(targets.map(async d => {
        const rows = (await call('getDay', { date: d })) || [];
        return rows.map(r => ({ date: d, ...r }));
      }));
      results.forEach(arr => loadedEntries.push(...arr));
    }
    renderData();
  } catch (e) {
    toast(e.message, false);
  }
}

function renderData() {
  const rf = $('recvFilter');
  const filterRecv = (rf && rf.dataset.value) || '';
  let totalCash = 0, totalInsta = 0, totalVoda = 0;
  const byRecv = {};
  const addRecvAmt = (name, type, amt) => {
    if (!amt) return;
    const key = name || 'غير محدد';
    if (!byRecv[key]) byRecv[key] = { insta: 0, voda: 0 };
    byRecv[key][type] += amt;
  };

  const rowsToShow = [];

  loadedEntries.forEach(r => {
    const cash = filterRecv ? 0 : (Number(r.cash) || 0);
    const insta = (!filterRecv || r.instaRecv === filterRecv) ? (Number(r.insta) || 0) : 0;
    const voda = (!filterRecv || r.vodaRecv === filterRecv) ? (Number(r.voda) || 0) : 0;

    totalCash += cash;
    totalInsta += insta;
    totalVoda += voda;

    if (!filterRecv || r.instaRecv === filterRecv) addRecvAmt(r.instaRecv, 'insta', Number(r.insta) || 0);
    if (!filterRecv || r.vodaRecv === filterRecv) addRecvAmt(r.vodaRecv, 'voda', Number(r.voda) || 0);

    if (cash > 0 || insta > 0 || voda > 0) {
      rowsToShow.push({
        date: r.date,
        rep: r.rep,
        cash,
        insta,
        instaRecv: r.instaRecv,
        voda,
        vodaRecv: r.vodaRecv,
        sum: cash + insta + voda
      });
    }
  });

  $('stCash').textContent = fmt(totalCash);
  $('stInsta').textContent = fmt(totalInsta);
  $('stVoda').textContent = fmt(totalVoda);
  $('stAll').textContent = fmt(totalCash + totalInsta + totalVoda);

  const recvKeys = Object.keys(byRecv);
  if (!recvKeys.length) {
    $('recvBody').innerHTML = '<tr><td colspan="4" class="muted">مفيش تحويلات في الفترة دي</td></tr>';
  } else {
    $('recvBody').innerHTML = recvKeys.map(k => {
      const o = byRecv[k];
      return `<tr>
        <td class="name">${esc(k)}</td>
        <td class="amt">${fmt(o.insta)}</td>
        <td class="amt">${fmt(o.voda)}</td>
        <td class="amt"><span class="pill pos">${fmt(o.insta + o.voda)}</span></td>
      </tr>`;
    }).join('') + `
      <tr class="tot">
        <td class="name">الإجمالي</td>
        <td class="amt">${fmt(totalInsta)}</td>
        <td class="amt">${fmt(totalVoda)}</td>
        <td class="amt">${fmt(totalInsta + totalVoda)}</td>
      </tr>`;
  }

  const showDateCol = mode === 'range';
  $('detHead').innerHTML = `<tr>
    ${showDateCol ? '<th>التاريخ</th>' : ''}
    <th>المندوب</th>
    <th>كاش</th>
    <th>انستاباي</th>
    <th>فودافون كاش</th>
    <th>الإجمالي</th>
  </tr>`;

  if (!rowsToShow.length) {
    $('detBody').innerHTML = `<tr><td colspan="${showDateCol ? 6 : 5}" class="muted">مفيش تحصيلات مسجلة</td></tr>`;
  } else {
    $('detBody').innerHTML = rowsToShow.map(r => {
      const instaTxt = r.insta > 0 ? `${fmt(r.insta)}${r.instaRecv ? ` <span class="badge">${esc(r.instaRecv)}</span>` : ''}` : '<span class="amt zero">0</span>';
      const vodaTxt = r.voda > 0 ? `${fmt(r.voda)}${r.vodaRecv ? ` <span class="badge">${esc(r.vodaRecv)}</span>` : ''}` : '<span class="amt zero">0</span>';
      return `<tr>
        ${showDateCol ? `<td>${dmy(r.date)}</td>` : ''}
        <td class="name">${esc(r.rep)}</td>
        <td class="amt ${r.cash ? '' : 'zero'}">${fmt(r.cash)}</td>
        <td class="amt">${instaTxt}</td>
        <td class="amt">${vodaTxt}</td>
        <td class="amt"><span class="pill">${fmt(r.sum)}</span></td>
      </tr>`;
    }).join('') + `
      <tr class="tot">
        <td class="name" colspan="${showDateCol ? 2 : 1}">الإجمالي</td>
        <td class="amt">${fmt(totalCash)}</td>
        <td class="amt">${fmt(totalInsta)}</td>
        <td class="amt">${fmt(totalVoda)}</td>
        <td class="amt">${fmt(totalCash + totalInsta + totalVoda)}</td>
      </tr>`;
  }
}

(async function init() {
  const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = dark ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  paintThemeBtn(theme);

  const today = todayISO();
  $('dDate').value = today;
  $('fromDate').value = addDays(today, -6);
  $('toDate').value = today;
  $('recvFilterWrap').innerHTML = ddHTML([{ v: '', l: 'كل المستلمين' }], '', 'كل المستلمين', 'id="recvFilter"');

  try {
    const [days, recvs] = await Promise.all([call('listDays'), call('getReceivers')]);
    savedDaysList = days || [];
    if (savedDaysList.length && !savedDaysList.includes(today)) {
      $('dDate').value = savedDaysList[0];
    }
    renderSavedDays();
    const recvOpts = [{ v: '', l: 'كل المستلمين' }].concat((recvs || []).map(n => ({ v: n, l: n })));
    $('recvFilterWrap').innerHTML = ddHTML(recvOpts, '', 'كل المستلمين', 'id="recvFilter"');
  } catch (e) {
    toast(e.message, false);
  }
  loadData();
})();
</script>
</body>
</html>
