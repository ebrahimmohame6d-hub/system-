<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحويلات المستلمين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
</head>
<body>

<header>
  <h1>💸 تحويلات المستلمين</h1>
  <button class="hbtn theme" id="themeBtn" onclick="toggleTheme(this)" title="تبديل الوضع">🌙</button>
</header>

<div id="toasts"></div>

<div class="wrap">
  <aside class="side">
    <div class="side-title">القايمة</div>
    <a class="nav-item" href="index.html"><span class="ni">📊</span> حسابات المناديب</a>
    <a class="nav-item" href="manage.html"><span class="ni">👥</span> المناديب</a>
    <a class="nav-item on" href="transfers.html"><span class="ni">💸</span> التحويلات</a>
    <a class="nav-item" href="profit.html"><span class="ni">📈</span> أرباح الشركة</a>
  </aside>

  <main class="content">
    <div class="card">
      <div class="ctrl">
        <button class="btn" onclick="shift(1)">‹ التالي</button>
        <input type="date" id="tDate" onchange="onDate(this.value)">
        <button class="btn" onclick="shift(-1)">السابق ›</button>
      </div>
      <div class="ctrl" style="margin-top:12px;justify-content:space-between">
        <div class="seg">
          <button id="modeDay" class="on" onclick="setMode('day')">يوم واحد</button>
          <button id="modeAll" onclick="setMode('all')">كل الأيام</button>
        </div>
        <div id="scopeLabel" class="muted" style="padding:0"></div>
      </div>
    </div>

    <div class="card">
      <div class="stats">
        <div class="stat s-cash">الكاش المحصّل<b id="sCash">0</b></div>
        <div class="stat s-insta">انستاباي<b id="sInsta">0</b></div>
        <div class="stat s-voda">فودافون كاش<b id="sVoda">0</b></div>
        <div class="stat s-all">إجمالي التحويلات<b id="sAll">0</b></div>
      </div>
    </div>

    <div class="card">
      <h2 class="sec">تحويلات كل مستلم</h2>
      <div id="tBox"><div class="muted">جاري التحميل...</div></div>
    </div>

    <div class="card">
      <h2 class="sec">الكاش لكل مندوب</h2>
      <div id="cashBox"><div class="muted">جاري التحميل...</div></div>
    </div>
  </main>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwtdP1cSfohJVXLaJmOWcokwK9DJEJbAwUVSt1bG695tGMc5oAdmFJzbppo86mCPhw_/exec';

let mode = 'day', curDate = '', recvList = [], reps = [];
const $ = id => document.getElementById(id);

function call(action, params = {}) {
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    const qs = new URLSearchParams({ ...params, action, callback: cbName });
    const script = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('انتهت مهلة الاتصال، جرب تاني')); }, 20000);
    function cleanup() { clearTimeout(timer); delete window[cbName]; script.remove(); }
    window[cbName] = res => {
      cleanup();
      if (res && res.ok) resolve(res.data);
      else reject(new Error((res && res.error) || 'حصل خطأ'));
    };
    script.onerror = () => { cleanup(); reject(new Error('فشل الاتصال بالسيرفر')); };
    script.src = API_URL + '?' + qs.toString();
    document.body.appendChild(script);
  });
}

function fmt(n) { return Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
function pad(n) { return String(n).padStart(2, '0'); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function addDays(iso, n) { const [y,m,d] = iso.split('-').map(Number); const x = new Date(y, m-1, d+n); return x.getFullYear() + '-' + pad(x.getMonth()+1) + '-' + pad(x.getDate()); }
function dmy(iso) { const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3]+'/'+m[2]+'/'+m[1] : esc(iso); }

function paintThemeBtn(th) { const b = $('themeBtn'); if (b) b.textContent = th === 'dark' ? '☀️' : '🌙'; }
function toggleTheme(btn) {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  paintThemeBtn(next);
  if (btn) { btn.classList.remove('spin'); void btn.offsetWidth; btn.classList.add('spin'); }
}
function toast(text, ok) {
  const t = document.createElement('div');
  t.className = 'toast ' + (ok ? 'ok' : 'err');
  t.textContent = text;
  $('toasts').appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 4000);
}

async function collectRows() {
  if (mode === 'day') {
    const rows = await call('getDay', { date: curDate });
    return { rows: rows || [], days: rows ? 1 : 0 };
  }
  const days = (await call('listDays')) || [];
  const results = await Promise.all(days.map(d => call('getDay', { date: d }).catch(() => null)));
  let all = [], count = 0;
  results.forEach(r => { if (r) { all = all.concat(r); count++; } });
  return { rows: all, days: count };
}

async function render() {
  $('tBox').innerHTML = '<div class="muted">جاري التحميل...</div>';
  $('cashBox').innerHTML = '<div class="muted">جاري التحميل...</div>';
  try {
    const { rows, days } = await collectRows();
    let cash = 0, insta = 0, voda = 0;
    const byRecv = {};
    recvList.forEach(n => { byRecv[n] = { insta: 0, voda: 0 }; });
    const byRep = {};
    rows.forEach(r => {
      const c = Number(r.cash) || 0, ins = Number(r.insta) || 0, vod = Number(r.voda) || 0;
      cash += c; insta += ins; voda += vod;
      byRep[r.rep] = (byRep[r.rep] || 0) + c;
      if (r.instaRecv && byRecv[r.instaRecv]) byRecv[r.instaRecv].insta += ins;
      if (r.vodaRecv && byRecv[r.vodaRecv]) byRecv[r.vodaRecv].voda += vod;
    });

    $('sCash').textContent = fmt(cash);
    $('sInsta').textContent = fmt(insta);
    $('sVoda').textContent = fmt(voda);
    $('sAll').textContent = fmt(insta + voda);
    $('scopeLabel').textContent = mode === 'day'
      ? 'يوم ' + dmy(curDate) + (days ? '' : ' (مفيش بيانات محفوظة)')
      : 'كل الأيام المحفوظة (' + days + ' يوم)';

    if (!recvList.length) {
      $('tBox').innerHTML = '<div class="muted">مفيش مستلمين</div>';
    } else {
      let ti = 0, tv = 0;
      const body = recvList.map(n => {
        const v = byRecv[n] || { insta: 0, voda: 0 };
        ti += v.insta; tv += v.voda;
        return `<tr>
          <td class="name"><span class="badge">مستلم</span>${esc(n)}</td>
          <td><span class="amt ${v.insta ? '' : 'zero'}">${fmt(v.insta)}</span></td>
          <td><span class="amt ${v.voda ? '' : 'zero'}">${fmt(v.voda)}</span></td>
          <td><span class="amt">${fmt(v.insta + v.voda)}</span></td></tr>`;
      }).join('');
      $('tBox').innerHTML = `<div class="tscroll"><table>
        <thead><tr><th>المستلم</th><th>انستاباي</th><th>فودافون كاش</th><th>الإجمالي</th></tr></thead>
        <tbody>${body}<tr class="tot"><td class="name">الإجمالي</td><td><span class="amt">${fmt(ti)}</span></td><td><span class="amt">${fmt(tv)}</span></td><td><span class="amt">${fmt(ti + tv)}</span></td></tr></tbody>
      </table></div>`;
    }

    const cashRows = reps.map(r => {
      const v = byRep[r.name] || 0;
      return `<tr><td class="name">${esc(r.name)}</td><td><span class="amt ${v ? '' : 'zero'}">${fmt(v)}</span></td></tr>`;
    }).join('');
    $('cashBox').innerHTML = `<div class="tscroll"><table>
      <thead><tr><th>المندوب</th><th>الكاش المحصّل</th></tr></thead>
      <tbody>${cashRows}<tr class="tot"><td class="name">الإجمالي</td><td><span class="amt">${fmt(cash)}</span></td></tr></tbody>
    </table></div>`;
  } catch (e) {
    $('tBox').innerHTML = '<div class="muted">خطأ: ' + esc(e.message) + '</div>';
    $('cashBox').innerHTML = '';
    toast(e.message, false);
  }
}

function setMode(m) {
  mode = m;
  $('modeDay').classList.toggle('on', m === 'day');
  $('modeAll').classList.toggle('on', m === 'all');
  render();
}
function onDate(v) { if (!v) return; curDate = v; render(); }
function shift(n) {
  curDate = addDays(curDate || todayISO(), n);
  $('tDate').value = curDate;
  render();
}

(async function init() {
  const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = dark ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  paintThemeBtn(theme);
  curDate = todayISO();
  $('tDate').value = curDate;
  try {
    recvList = (await call('getReceivers')) || [];
    reps = (await call('getReps')) || [];
  } catch (e) { toast('تعذر تحميل البيانات: ' + e.message, false); }
  render();
})();
</script>
</body>
</html>
