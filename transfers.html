<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التحويلات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
</head>
<body>

<header>
  <h1>💸 التحويلات</h1>
  <button class="hbtn theme" id="themeBtn" onclick="toggleTheme(this)" title="تبديل الوضع">🌙</button>
</header>

<div id="toasts"></div>

<div class="wrap">
  <aside class="side">
    <div class="side-title">القايمة</div>
    <a class="nav-item" href="index.html"><span class="ni">📊</span> حسابات المناديب</a>
    <a class="nav-item" href="manage.html"><span class="ni">👥</span> المناديب</a>
    <a class="nav-item on" href="transfers.html"><span class="ni">💸</span> التحويلات</a>
    <a class="nav-item" href="profit.html"><span class="ni">📈</span> أرباح الشركة</a>
    <a class="nav-item" href="weekly.html"><span class="ni">🗓️</span> حساب الأسبوعي</a>
    <a class="nav-item" href="gamiya.html"><span class="ni">🤝</span> الجمعية</a>
  </aside>

  <main class="content">
    <div class="card">
      <div class="ctrl" style="justify-content:space-between;margin-bottom:12px">
        <div class="seg">
          <button id="modeDay" class="on" onclick="setMode('day')">تحويلات اليوم</button>
          <button id="modeAll" onclick="setMode('all')">كل الأيام</button>
        </div>
        <div id="scopeLabel" class="muted"></div>
      </div>

      <div id="dayControls" class="ctrl">
        <button class="btn" onclick="shift(1)">‹ التالي</button>
        <input type="date" id="tDate" onchange="onDate(this.value)">
        <button class="btn" onclick="shift(-1)">السابق ›</button>
      </div>
    </div>

    <div class="card">
      <div class="stats">
        <div class="stat s-cash">الكاش<b id="stCash">0</b></div>
        <div class="stat s-insta">انستاباي<b id="stInsta">0</b></div>
        <div class="stat s-voda">فودافون كاش<b id="stVoda">0</b></div>
        <div class="stat s-all">الإجمالي الكلي<b id="stAll">0</b></div>
      </div>
    </div>

    <div class="card">
      <h2 class="sec">التحويلات حسب المستلم</h2>
      <div class="tbl-box"><div id="recvTable" class="tscroll"><div class="muted" style="padding:14px">جاري التحميل...</div></div></div>
    </div>

    <div class="card">
      <h2 class="sec">تفصيل تحويلات المناديب</h2>
      <div class="tbl-box"><div id="repTable" class="tscroll"><div class="muted" style="padding:14px">جاري التحميل...</div></div></div>
    </div>
  </main>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwtdP1cSfohJVXLaJmOWcokwK9DJEJbAwUVSt1bG695tGMc5oAdmFJzbppo86mCPhw_/exec';

let mode = 'day', curDate = '';
const $ = id => document.getElementById(id);

function call(action, params = {}) {
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    const qs = new URLSearchParams({ ...params, action, callback: cbName });
    const script = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('انتهت مهلة الاتصال، جرب تاني')); }, 20000);
    function cleanup() { clearTimeout(timer); delete window[cbName]; script.remove(); }
    window[cbName] = res => {
      cleanup();
      if (res && res.ok) resolve(res.data);
      else reject(new Error((res && res.error) || 'حصل خطأ'));
    };
    script.onerror = () => { cleanup(); reject(new Error('فشل الاتصال بالسيرفر')); };
    script.src = API_URL + '?' + qs.toString();
    document.body.appendChild(script);
  });
}

function fmt(n) { return Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
function pad(n) { return String(n).padStart(2, '0'); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function addDays(iso, n) { const [y,m,d] = iso.split('-').map(Number); const x = new Date(y, m-1, d+n); return x.getFullYear() + '-' + pad(x.getMonth()+1) + '-' + pad(x.getDate()); }
function dmy(iso) { const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3]+'/'+m[2]+'/'+m[1] : esc(iso); }

function paintThemeBtn(th) { const b = $('themeBtn'); if (b) b.textContent = th === 'dark' ? '☀️' : '🌙'; }
function toggleTheme(btn) {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  paintThemeBtn(next);
  if (btn) { btn.classList.remove('spin'); void btn.offsetWidth; btn.classList.add('spin'); }
}
function toast(text, ok) {
  const t = document.createElement('div');
  t.className = 'toast ' + (ok ? 'ok' : 'err');
  t.textContent = text;
  $('toasts').appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 4000);
}

async function render() {
  $('recvTable').innerHTML = '<div class="muted" style="padding:14px">جاري التحميل...</div>';
  $('repTable').innerHTML = '<div class="muted" style="padding:14px">جاري التحميل...</div>';
  try {
    let rows = [];
    let daysCount = 0;

    if (mode === 'day') {
      const data = await call('getDay', { date: curDate });
      if (data) {
        rows = data.map(r => ({ ...r, date: curDate }));
        daysCount = 1;
      }
      $('scopeLabel').textContent = 'يوم ' + dmy(curDate) + (daysCount ? '' : ' (مفيش بيانات محفوظة)');
    } else {
      const days = (await call('listDays')) || [];
      const results = await Promise.all(days.map(d => call('getDay', { date: d }).catch(() => null)));
      results.forEach((arr, idx) => {
        if (arr) {
          daysCount++;
          arr.forEach(r => rows.push({ ...r, date: days[idx] }));
        }
      });
      $('scopeLabel').textContent = 'كل الأيام المحفوظة (' + daysCount + ' يوم)';
    }

    let totCash = 0, totInsta = 0, totVoda = 0;
    const recvMap = {};
    const repRows = [];

    rows.forEach(r => {
      const c = Number(r.cash) || 0;
      const ins = Number(r.insta) || 0;
      const vod = Number(r.voda) || 0;
      totCash += c;
      totInsta += ins;
      totVoda += vod;

      if (ins > 0) {
        const k = r.instaRecv || 'غير محدد';
        if (!recvMap[k]) recvMap[k] = { insta: 0, voda: 0 };
        recvMap[k].insta += ins;
      }
      if (vod > 0) {
        const k = r.vodaRecv || 'غير محدد';
        if (!recvMap[k]) recvMap[k] = { insta: 0, voda: 0 };
        recvMap[k].voda += vod;
      }
      if (ins > 0 || vod > 0 || c > 0) {
        repRows.push({
          date: r.date,
          rep: r.rep,
          cash: c,
          insta: ins,
          instaRecv: r.instaRecv || '—',
          voda: vod,
          vodaRecv: r.vodaRecv || '—',
          sum: c + ins + vod
        });
      }
    });

    $('stCash').textContent = fmt(totCash);
    $('stInsta').textContent = fmt(totInsta);
    $('stVoda').textContent = fmt(totVoda);
    $('stAll').textContent = fmt(totCash + totInsta + totVoda);

    const recvEntries = Object.entries(recvMap).sort((a, b) => (b[1].insta + b[1].voda) - (a[1].insta + a[1].voda));
    if (!recvEntries.length) {
      $('recvTable').innerHTML = '<div class="muted" style="padding:14px">مفيش تحويلات انستاباي أو فودافون كاش</div>';
    } else {
      const body = recvEntries.map(([name, v]) => `<tr>
        <td class="name">${esc(name)}</td>
        <td class="amt">${fmt(v.insta)}</td>
        <td class="amt">${fmt(v.voda)}</td>
        <td><span class="pill pos">${fmt(v.insta + v.voda)}</span></td>
      </tr>`).join('');
      $('recvTable').innerHTML = `<table>
        <thead><tr><th>المستلم</th><th>انستاباي</th><th>فودافون كاش</th><th>الإجمالي</th></tr></thead>
        <tbody>${body}
          <tr class="tot"><td class="name">الإجمالي</td><td class="amt">${fmt(totInsta)}</td><td class="amt">${fmt(totVoda)}</td><td><span class="pill">${fmt(totInsta + totVoda)}</span></td></tr>
        </tbody></table>`;
    }

    if (!repRows.length) {
      $('repTable').innerHTML = '<div class="muted" style="padding:14px">مفيش بيانات</div>';
    } else {
      const dateTh = mode === 'all' ? '<th>التاريخ</th>' : '';
      const body = repRows.map(r => `<tr>
        ${mode === 'all' ? `<td>${dmy(r.date)}</td>` : ''}
        <td class="name">${esc(r.rep)}</td>
        <td class="amt">${fmt(r.cash)}</td>
        <td class="amt">${fmt(r.insta)}</td>
        <td>${esc(r.instaRecv)}</td>
        <td class="amt">${fmt(r.voda)}</td>
        <td>${esc(r.vodaRecv)}</td>
        <td><span class="pill">${fmt(r.sum)}</span></td>
      </tr>`).join('');
      $('repTable').innerHTML = `<table>
        <thead><tr>${dateTh}<th>المندوب</th><th>كاش</th><th>انستاباي</th><th>مستلم انستا</th><th>فودافون</th><th>مستلم فودافون</th><th>الإجمالي</th></tr></thead>
        <tbody>${body}</tbody></table>`;
    }
  } catch (e) {
    $('recvTable').innerHTML = '<div class="muted" style="padding:14px">خطأ: ' + esc(e.message) + '</div>';
    $('repTable').innerHTML = '';
    toast(e.message, false);
  }
}

function setMode(m) {
  mode = m;
  $('modeDay').classList.toggle('on', m === 'day');
  $('modeAll').classList.toggle('on', m === 'all');
  $('dayControls').style.display = m === 'day' ? 'flex' : 'none';
  render();
}
function onDate(v) { if (!v) return; curDate = v; render(); }
function shift(n) {
  curDate = addDays(curDate || todayISO(), n);
  $('tDate').value = curDate;
  render();
}

(function init() {
  const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = dark ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  paintThemeBtn(theme);
  curDate = todayISO();
  $('tDate').value = curDate;
  render();
})();
</script>
</body>
</html>
