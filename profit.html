<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أرباح الشركة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f8; --surface:#ffffff; --surface2:#f4f6fc; --ink:#1b2140; --muted:#5b6485; --line:#e3e7f3;
  --p1:#4f46e5; --p2:#7c3aed; --bad:#ef4444; --ok:#10b981;
  --shadow:0 4px 18px rgba(79,70,229,.08);
}
[data-theme="dark"]{
  --bg:#0d1125; --surface:#161b37; --surface2:#1d2346; --ink:#f1f3ff; --muted:#b4bde3; --line:#2a3160;
  --shadow:0 4px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);transition:background .3s,color .3s}
header{
  display:flex;align-items:center;justify-content:space-between;padding:16px 20px;color:#fff;
  background:linear-gradient(120deg,#10b981,#0ea5e9,#6366f1);background-size:300% 300%;
  box-shadow:0 6px 24px rgba(16,185,129,.3);animation:shimmer 10s ease infinite;
}
header h1{margin:0;font-size:21px;font-weight:800;animation:fadeUp .5s both}
.hbtn{
  height:40px;padding:0 14px;border-radius:12px;border:0;cursor:pointer;background:rgba(255,255,255,.2);
  color:#fff;font-family:inherit;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:transform .2s,background .2s;
}
.hbtn:hover{transform:translateY(-2px);background:rgba(255,255,255,.32)}
.theme{width:40px;padding:0;justify-content:center;font-size:18px}
.theme.spin{animation:spinOnce .6s ease}

.wrap{max-width:1040px;margin:20px auto;padding:0 14px;display:flex;gap:16px;align-items:flex-start}
main.content{flex:1;min-width:0;max-width:840px}
.side{
  width:200px;flex-shrink:0;position:sticky;top:16px;display:flex;flex-direction:column;gap:8px;
  padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);animation:fadeUp .5s both;
}
.side-title{font-weight:800;color:var(--muted);font-size:13px;padding:0 4px 4px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;border:0;cursor:pointer;
  color:var(--ink);text-decoration:none;font-family:inherit;font-weight:800;font-size:15px;text-align:right;
  background:var(--surface2);transition:transform .2s,background .2s,box-shadow .2s;
}
.nav-item:hover{transform:translateX(-4px);background:linear-gradient(90deg,rgba(79,70,229,.14),rgba(124,58,237,.05))}
.nav-item.on{background:linear-gradient(135deg,#10b981,#0ea5e9);color:#fff;box-shadow:0 8px 20px rgba(16,185,129,.3)}
.nav-item .ni{font-size:18px;display:inline-block;animation:floatY 3s ease-in-out infinite}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
  padding:18px;margin-bottom:14px;animation:fadeUp .45s both;transition:transform .25s,box-shadow .25s;
}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(79,70,229,.14)}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctrl input[type=date]{
  flex:1;min-width:160px;padding:11px 12px;font-size:15px;font-family:inherit;color:var(--ink);
  border:1.5px solid var(--line);border-radius:12px;background:var(--surface2);outline:none;color-scheme:light;
}
[data-theme="dark"] .ctrl input[type=date]{color-scheme:dark}
.btn{
  padding:11px 16px;border:0;border-radius:12px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;
  color:#fff;background:linear-gradient(135deg,var(--p1),var(--p2));transition:transform .2s,filter .2s;
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{
  border:0;background:transparent;padding:8px 12px;border-radius:9px;font-family:inherit;font-size:14px;font-weight:700;
  color:var(--muted);cursor:pointer;transition:background .25s,color .25s;
}
.seg button.on{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.3)}
.muted{color:var(--muted);font-weight:700;font-size:14px}

.sec{font-weight:800;font-size:17px;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.sec::before{content:"";width:6px;height:20px;border-radius:4px;background:linear-gradient(var(--p1),var(--p2))}

/* كروت الشركات */
.co-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.co{border-radius:18px;padding:16px;color:#fff;box-shadow:0 10px 24px rgba(0,0,0,.14);animation:pop .55s both;transition:transform .3s,box-shadow .3s;position:relative;overflow:hidden}
.co:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 16px 30px rgba(0,0,0,.22)}
.co::after{content:"";position:absolute;left:-30px;bottom:-34px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.15)}
.co:nth-child(2){animation-delay:.1s}
.co:nth-child(3){animation-delay:.2s}
.co h3{margin:0 0 8px;font-size:17px;font-weight:800}
.co .sub{font-size:12px;opacity:.92;font-weight:700;margin-bottom:6px}
.co .pv{font-family:Consolas,'Courier New',monospace;font-size:24px;font-weight:800;margin:6px 0}
.s-oz{background:linear-gradient(135deg,#0284c7,#0ea5e9,#22d3ee)}
.s-tl{background:linear-gradient(135deg,#7c3aed,#a855f7,#d946ef)}
.s-mq{background:linear-gradient(135deg,#ea580c,#f97316,#fbbf24)}

/* ربح الشركة الإجمالي */
.big{
  margin-top:4px;padding:20px 22px;border-radius:18px;color:#fff;display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(135deg,#059669,#10b981,#14b8a6);background-size:200% 200%;animation:shimmer 6s ease infinite;
  box-shadow:0 14px 30px rgba(16,185,129,.35);
}
.big span{font-size:18px;font-weight:800}
.big b{font-size:34px;font-family:Consolas,'Courier New',monospace;animation:pop .6s both}

/* الجداول */
.tscroll{overflow-x:auto;border-radius:16px;border:1px solid var(--line)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:15px;min-width:480px}
thead th{
  background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-weight:800;padding:13px 10px;
  text-align:center;white-space:nowrap;font-size:14px;
}
thead th:first-child{border-top-right-radius:16px}
thead th:last-child{border-top-left-radius:16px}
tbody td{
  padding:13px 10px;text-align:center;font-weight:700;border-top:1px solid var(--line);
  background:var(--surface);animation:rowIn .5s both;transition:background .2s;
}
tbody tr:nth-child(1) td{animation-delay:.05s}
tbody tr:nth-child(2) td{animation-delay:.12s}
tbody tr:nth-child(3) td{animation-delay:.19s}
tbody tr:nth-child(4) td{animation-delay:.26s}
tbody tr:nth-child(5) td{animation-delay:.33s}
tbody tr:nth-child(6) td{animation-delay:.4s}
tbody tr:hover td{background:rgba(79,70,229,.07)}
td.name{text-align:right;font-weight:800}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:8px;vertical-align:middle}
.dot.oz{background:#0ea5e9}
.dot.tl{background:#a855f7}
.dot.mq{background:#f97316}
.num{font-family:Consolas,'Courier New',monospace;font-size:15px}
.pill{
  display:inline-block;min-width:44px;padding:4px 10px;border-radius:999px;font-family:Consolas,'Courier New',monospace;
  font-weight:800;background:rgba(79,70,229,.1);color:var(--p1);
}
.pill.pos{background:rgba(16,185,129,.14);color:#059669}
.pill.neg{background:rgba(239,68,68,.14);color:var(--bad)}
.zero{color:var(--muted);font-weight:600}
tr.tot td{background:linear-gradient(90deg,rgba(79,70,229,.14),var(--surface2));font-weight:800;border-top:2px solid var(--line)}
tr.tot td:first-child{border-bottom-right-radius:16px}
tr.tot td:last-child{border-bottom-left-radius:16px}

/* شريط نسبة الربح لكل مندوب */
.bar{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden;margin-top:6px;min-width:80px}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#10b981,#14b8a6);animation:grow .9s ease both}
@keyframes grow{from{width:0}}

#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;width:min(92vw,420px);display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:12px 14px;border-radius:12px;color:#fff;font-weight:700;font-size:14px;box-shadow:0 10px 24px rgba(0,0,0,.25);animation:toastIn .4s cubic-bezier(.2,.9,.3,1.2)}
.toast.ok{background:linear-gradient(135deg,#059669,#10b981)}
.toast.err{background:linear-gradient(135deg,#dc2626,#f97316)}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes shimmer{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes spinOnce{to{transform:rotate(360deg)}}

@media(max-width:760px){
  .wrap{flex-direction:column;margin-top:12px}
  main.content{max-width:none;width:100%}
  .side{width:100%;position:static;flex-direction:row;flex-wrap:wrap;padding:10px}
  .side-title{display:none}
  .nav-item{flex:1 1 auto;justify-content:center;padding:10px 8px;font-size:14px}
  .co-cards{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <h1>📈 أرباح الشركة</h1>
  <button class="hbtn theme" id="themeBtn" onclick="toggleTheme(this)" title="تبديل الوضع">🌙</button>
</header>

<div id="toasts"></div>

<div class="wrap">
  <aside class="side">
    <div class="side-title">القايمة</div>
    <a class="nav-item" href="index.html"><span class="ni">📊</span> حسابات المناديب</a>
    <a class="nav-item" href="manage.html"><span class="ni">👥</span> المناديب</a>
    <a class="nav-item" href="transfers.html"><span class="ni">💸</span> التحويلات</a>
    <a class="nav-item on" href="profit.html"><span class="ni">📈</span> أرباح الشركة</a>
  </aside>

  <main class="content">
    <div class="card">
      <div class="ctrl">
        <button class="btn" onclick="shift(1)">‹ التالي</button>
        <input type="date" id="pDate" onchange="onDate(this.value)">
        <button class="btn" onclick="shift(-1)">السابق ›</button>
      </div>
      <div class="ctrl" style="margin-top:12px;justify-content:space-between">
        <div class="seg">
          <button id="modeDay" class="on" onclick="setMode('day')">يوم واحد</button>
          <button id="modeAll" onclick="setMode('all')">كل الأيام</button>
        </div>
        <div id="scopeLabel" class="muted"></div>
      </div>
    </div>

    <div class="card">
      <h2 class="sec">ملخص الشحنات حسب الشركة</h2>
      <div id="coCards" class="co-cards"></div>
      <div class="big">
        <span>ربح الشركة الإجمالي</span>
        <b id="grandProfit">0</b>
      </div>
    </div>

    <div class="card">
      <h2 class="sec">تفصيل كل شركة (داخل وخارج الزون)</h2>
      <div id="coTable"><div class="muted">جاري التحميل...</div></div>
    </div>

    <div class="card">
      <h2 class="sec">ربح الشركة من كل مندوب</h2>
      <div id="repTable"><div class="muted">جاري التحميل...</div></div>
    </div>
  </main>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwtdP1cSfohJVXLaJmOWcokwK9DJEJbAwUVSt1bG695tGMc5oAdmFJzbppo86mCPhw_/exec';

let cfg = null;
let rateMap = {};
let mode = 'day';
let curDate = '';

function call(action, params = {}) {
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    const qs = new URLSearchParams({ ...params, action, callback: cbName });
    const script = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('انتهت مهلة الاتصال، جرب تاني')); }, 20000);
    function cleanup() { clearTimeout(timer); delete window[cbName]; script.remove(); }
    window[cbName] = res => {
      cleanup();
      if (res && res.ok) resolve(res.data);
      else reject(new Error((res && res.error) || 'حصل خطأ'));
    };
    script.onerror = () => { cleanup(); reject(new Error('فشل الاتصال بالسيرفر')); };
    script.src = API_URL + '?' + qs.toString();
    document.body.appendChild(script);
  });
}

function fmt(n) { return Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
function pad(n) { return String(n).padStart(2, '0'); }
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function addDays(iso, n) {
  const [y, m, d] = iso.split('-').map(Number);
  const x = new Date(y, m - 1, d + n);
  return x.getFullYear() + '-' + pad(x.getMonth()+1) + '-' + pad(x.getDate());
}
function dmy(iso) {
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[3] + '/' + m[2] + '/' + m[1] : esc(iso);
}

function paintThemeBtn(theme) { const b = document.getElementById('themeBtn'); if (b) b.textContent = theme === 'dark' ? '☀️' : '🌙'; }
function toggleTheme(btn) {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  paintThemeBtn(next);
  if (btn) { btn.classList.remove('spin'); void btn.offsetWidth; btn.classList.add('spin'); }
}

function toast(text, ok) {
  const t = document.createElement('div');
  t.className = 'toast ' + (ok ? 'ok' : 'err');
  t.textContent = text;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 4000);
}

async function collectRows() {
  if (mode === 'day') {
    const rows = await call('getDay', { date: curDate });
    return { rows: rows || [], days: rows ? 1 : 0 };
  }
  const days = (await call('listDays')) || [];
  const results = await Promise.all(days.map(d => call('getDay', { date: d }).catch(() => null)));
  let all = [], n = 0;
  results.forEach(r => { if (r) { all = all.concat(r); n++; } });
  return { rows: all, days: n };
}

// ربح الشركة = مجموع (سعر الشركة − عمولة المندوب للشحنة) × عدد الشحنات في كل خانة
function compute(rows) {
  const CO = cfg.keys;
  const co = {};
  CO.forEach(k => { co[k] = { inN: 0, inP: 0, outN: 0, outP: 0 }; });
  const reps = {};

  rows.forEach(r => {
    const rate = rateMap[r.rep] || 27;
    if (!reps[r.rep]) reps[r.rep] = { n: 0, p: 0 };
    CO.forEach(k => {
      const zi = Number(r.zin && r.zin[k]) || 0;
      const zo = Number(r.zout && r.zout[k]) || 0;
      const pi = zi * (cfg.prices.inZone[k] - rate);
      const po = zo * (cfg.prices.outZone[k] - rate);
      co[k].inN += zi; co[k].inP += pi;
      co[k].outN += zo; co[k].outP += po;
      reps[r.rep].n += zi + zo;
      reps[r.rep].p += pi + po;
    });
  });
  return { co, reps };
}

function signCls(v) { return v < 0 ? ' neg' : ''; }
function pillCls(v) { return v < 0 ? 'pill neg' : v > 0 ? 'pill pos' : 'pill'; }

async function render() {
  const coCards = document.getElementById('coCards');
  const coTable = document.getElementById('coTable');
  const repTable = document.getElementById('repTable');
  coTable.innerHTML = '<div class="muted">جاري التحميل...</div>';
  repTable.innerHTML = '<div class="muted">جاري التحميل...</div>';

  try {
    if (!cfg) cfg = await call('getPrices');
    if (!Object.keys(rateMap).length) {
      const reps = (await call('getReps')) || [];
      reps.forEach(r => { rateMap[r.name] = r.rate; });
    }

    const { rows, days } = await collectRows();
    const { co, reps } = compute(rows);
    const CO = cfg.keys;

    document.getElementById('scopeLabel').textContent = mode === 'day'
      ? 'يوم ' + dmy(curDate) + (days ? '' : ' (مفيش بيانات محفوظة)')
      : 'كل الأيام المحفوظة (' + days + ' يوم)';

    let grand = 0;
    CO.forEach(k => { grand += co[k].inP + co[k].outP; });
    document.getElementById('grandProfit').textContent = fmt(grand);

    coCards.innerHTML = CO.map((k, idx) => {
      const n = co[k].inN + co[k].outN;
      const p = co[k].inP + co[k].outP;
      const cls = ['s-oz', 's-tl', 's-mq'][idx];
      return `<div class="co ${cls}">
        <h3>${esc(cfg.names[k])}</h3>
        <div class="sub">داخل: ${co[k].inN} | خارج: ${co[k].outN}</div>
        <div class="pv">${fmt(p)}</div>
        <div class="sub">إجمالي الشحنات: ${n}</div>
      </div>`;
    }).join('');

    const dotCls = { oz: 'oz', tl: 'tl', mq: 'mq' };
    const coRows = CO.map(k => {
      const inN = co[k].inN, outN = co[k].outN, inP = co[k].inP, outP = co[k].outP;
      return `<tr>
        <td class="name"><span class="dot ${dotCls[k]}"></span>${esc(cfg.names[k])}</td>
        <td><span class="pill">${inN}</span></td>
        <td><span class="${pillCls(inP)}">${fmt(inP)}</span></td>
        <td><span class="pill">${outN}</span></td>
        <td><span class="${pillCls(outP)}">${fmt(outP)}</span></td>
        <td><span class="pill">${inN + outN}</span></td>
        <td><span class="${pillCls(inP + outP)}">${fmt(inP + outP)}</span></td>
      </tr>`;
    }).join('');

    const totIn = CO.reduce((a, k) => a + co[k].inN, 0);
    const totInP = CO.reduce((a, k) => a + co[k].inP, 0);
    const totOut = CO.reduce((a, k) => a + co[k].outN, 0);
    const totOutP = CO.reduce((a, k) => a + co[k].outP, 0);

    coTable.innerHTML = `<div class="tscroll"><table>
      <thead><tr>
        <th>الشركة</th><th>داخل: عدد</th><th>داخل: ربح</th><th>خارج: عدد</th><th>خارج: ربح</th><th>الإجمالي: عدد</th><th>الإجمالي: ربح</th>
      </tr></thead>
      <tbody>${coRows}
        <tr class="tot">
          <td class="name">الإجمالي</td>
          <td><span class="pill">${totIn}</span></td><td><span class="${pillCls(totInP)}">${fmt(totInP)}</span></td>
          <td><span class="pill">${totOut}</span></td><td><span class="${pillCls(totOutP)}">${fmt(totOutP)}</span></td>
          <td><span class="pill">${totIn + totOut}</span></td><td><span class="${pillCls(totInP + totOutP)}">${fmt(totInP + totOutP)}</span></td>
        </tr>
      </tbody></table></div>`;

    const repList = Object.keys(reps).map(n => ({ name: n, n: reps[n].n, p: reps[n].p })).sort((a, b) => b.p - a.p);
    if (!repList.length) {
      repTable.innerHTML = '<div class="muted">مفيش بيانات</div>';
    } else {
      const maxP = Math.max(...repList.map(r => Math.abs(r.p)), 1);
      const body = repList.map(r => `<tr>
        <td class="name">${esc(r.name)}</td>
        <td><span class="pill">${r.n}</span></td>
        <td>
          <span class="${pillCls(r.p)}">${fmt(r.p)}</span>
          <div class="bar"><i style="width:${Math.round(Math.abs(r.p) / maxP * 100)}%"></i></div>
        </td>
      </tr>`).join('');
      repTable.innerHTML = `<div class="tscroll"><table>
        <thead><tr><th>المندوب</th><th>عدد الشحنات (داخل + خارج)</th><th>ربح الشركة</th></tr></thead>
        <tbody>${body}
          <tr class="tot">
            <td class="name">الإجمالي</td>
            <td><span class="pill">${repList.reduce((a, r) => a + r.n, 0)}</span></td>
            <td><span class="${pillCls(grand)}">${fmt(grand)}</span></td>
          </tr>
        </tbody></table></div>`;
    }
  } catch (e) {
    coTable.innerHTML = '<div class="muted">خطأ: ' + esc(e.message) + '</div>';
    repTable.innerHTML = '';
    toast(e.message, false);
  }
}

function setMode(m) {
  mode = m;
  document.getElementById('modeDay').classList.toggle('on', m === 'day');
  document.getElementById('modeAll').classList.toggle('on', m === 'all');
  render();
}

function onDate(v) { if (!v) return; curDate = v; render(); }

function shift(n) {
  curDate = addDays(curDate || todayISO(), n);
  document.getElementById('pDate').value = curDate;
  render();
}

(async function init() {
  const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = dark ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  paintThemeBtn(theme);
  curDate = todayISO();
  document.getElementById('pDate').value = curDate;
  render();
})();
</script>
</body>
</html>
