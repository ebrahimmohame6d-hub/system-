<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أرباح الشركة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
</head>
<body>

<header>
  <h1>📈 أرباح الشركة</h1>
  <button class="hbtn theme" id="themeBtn" onclick="toggleTheme(this)" title="تبديل الوضع">🌙</button>
</header>

<div id="toasts"></div>

<div class="wrap">
  <aside class="side">
    <div class="side-title">القايمة</div>
    <a class="nav-item" href="index.html"><span class="ni">📊</span> حسابات المناديب</a>
    <a class="nav-item" href="manage.html"><span class="ni">👥</span> المناديب</a>
    <a class="nav-item" href="transfers.html"><span class="ni">💸</span> التحويلات</a>
    <a class="nav-item on" href="profit.html"><span class="ni">📈</span> أرباح الشركة</a>
    <a class="nav-item" href="weekly.html"><span class="ni">🗓️</span> حساب الأسبوعي</a>
    <a class="nav-item" href="gamiya.html"><span class="ni">🤝</span> الجمعية</a>
  </aside>

  <main class="content">
    <div class="card">
      <div class="ctrl" style="margin-bottom:12px">
        <div class="seg">
          <button type="button" id="mDay" class="on" onclick="setMode('day')">يوم واحد</button>
          <button type="button" id="mRange" onclick="setMode('range')">فترة زمنية</button>
        </div>
      </div>

      <div id="dayControls" class="daybar">
        <div class="row">
          <button type="button" class="navbtn" onclick="shiftDay(1)">‹ التالي</button>
          <input type="date" id="dDate" onchange="loadData()">
          <button type="button" class="navbtn" onclick="shiftDay(-1)">السابق ›</button>
        </div>
        <div id="savedDaysWrap"></div>
      </div>

      <div id="rangeControls" class="formrow" style="display:none;grid-template-columns:1fr 1fr auto">
        <div>
          <label>من تاريخ</label>
          <input type="date" id="fromDate">
        </div>
        <div>
          <label>إلى تاريخ</label>
          <input type="date" id="toDate">
        </div>
        <button type="button" class="btn" onclick="loadData()">عرض</button>
      </div>
    </div>

    <div class="card">
      <div class="big" style="margin-bottom:14px">
        <span>صافي ربح الشركة</span>
        <b id="bigProfit">0</b>
      </div>
      <div class="stats" style="grid-template-columns:repeat(3,1fr)">
        <div class="stat s-all">إجمالي الشحنات<b id="stCount">0</b></div>
        <div class="stat s-cash">إيراد الشركات<b id="stRev">0</b></div>
        <div class="stat s-voda">عمولة المناديب<b id="stComm">0</b></div>
      </div>
    </div>

    <div class="co-cards" id="coCards"></div>

    <div class="card">
      <h2 class="sec">تفاصيل الأرباح حسب المندوب</h2>
      <div class="tbl-box">
        <div class="tscroll">
          <table>
            <thead>
              <tr>
                <th>المندوب</th>
                <th>داخل الزون</th>
                <th>خارج الزون</th>
                <th>الشحنات</th>
                <th>العمولة</th>
                <th>ربح الشركة</th>
              </tr>
            </thead>
            <tbody id="repBody">
              <tr><td colspan="6" class="muted">جاري التحميل...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwtdP1cSfohJVXLaJmOWcokwK9DJEJbAwUVSt1bG695tGMc5oAdmFJzbppo86mCPhw_/exec';

let mode = 'day';
let savedDaysList = [];
let priceData = { prices: { inZone: {}, outZone: {} }, names: {}, keys: [], outKeys: [] };
let repsMap = {};
const $ = id => document.getElementById(id);

function call(action, params = {}) {
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    const qs = new URLSearchParams({ ...params, action, callback: cbName });
    const script = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('انتهت مهلة الاتصال، جرب تاني')); }, 20000);
    function cleanup() { clearTimeout(timer); delete window[cbName]; script.remove(); }
    window[cbName] = res => {
      cleanup();
      if (res && res.ok) resolve(res.data);
      else reject(new Error((res && res.error) || 'حصل خطأ'));
    };
    script.onerror = () => { cleanup(); reject(new Error('فشل الاتصال بالسيرفر')); };
    script.src = API_URL + '?' + qs.toString();
    document.body.appendChild(script);
  });
}

function fmt(n) { return Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
function pad(n) { return String(n).padStart(2, '0'); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function addDays(iso, n) { const [y,m,d] = iso.split('-').map(Number); const x = new Date(y, m-1, d+n); return x.getFullYear() + '-' + pad(x.getMonth()+1) + '-' + pad(x.getDate()); }
function dmy(iso) { const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3]+'/'+m[2]+'/'+m[1] : esc(iso); }

function paintThemeBtn(th) { const b = $('themeBtn'); if (b) b.textContent = th === 'dark' ? '☀️' : '🌙'; }
function toggleTheme(btn) {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  paintThemeBtn(next);
  if (btn) { btn.classList.remove('spin'); void btn.offsetWidth; btn.classList.add('spin'); }
}
function toast(text, ok) {
  const t = document.createElement('div');
  t.className = 'toast ' + (ok ? 'ok' : 'err');
  t.textContent = text;
  $('toasts').appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 4000);
}

function renderSavedDays() {
  const cur = $('dDate').value;
  $('savedDaysWrap').innerHTML = `
    <select onchange="if(this.value){$('dDate').value=this.value;loadData();}">
      <option value="">-- أيام محفوظة قبل كده --</option>
      ${savedDaysList.map(d => `<option value="${d}" ${d === cur ? 'selected' : ''}>${dmy(d)}</option>`).join('')}
    </select>`;
}

function setMode(m) {
  mode = m;
  $('mDay').classList.toggle('on', m === 'day');
  $('mRange').classList.toggle('on', m === 'range');
  $('dayControls').style.display = m === 'day' ? '' : 'none';
  $('rangeControls').style.display = m === 'range' ? 'grid' : 'none';
  loadData();
}

function shiftDay(n) {
  $('dDate').value = addDays($('dDate').value || todayISO(), n);
  loadData();
}

async function loadData() {
  $('repBody').innerHTML = '<tr><td colspan="6" class="muted">جاري التحميل...</td></tr>';
  try {
    let allRows = [];
    if (mode === 'day') {
      const date = $('dDate').value || todayISO();
      renderSavedDays();
      allRows = (await call('getDay', { date })) || [];
    } else {
      const from = $('fromDate').value;
      const to = $('toDate').value;
      if (!from || !to) return toast('اختار تاريخ البداية والنهاية', false);
      const targets = savedDaysList.filter(d => d >= from && d <= to);
      const chunks = await Promise.all(targets.map(d => call('getDay', { date: d })));
      chunks.forEach(c => { if (c) allRows.push(...c); });
    }
    calculateAndRender(allRows);
  } catch (e) {
    toast(e.message, false);
  }
}

function calculateAndRender(rows) {
  const keys = priceData.keys || [];
  const outKeys = priceData.outKeys || [];
  const inP = (priceData.prices && priceData.prices.inZone) || {};
  const outP = (priceData.prices && priceData.prices.outZone) || {};
  const names = priceData.names || {};

  const coStats = {};
  keys.forEach(k => { coStats[k] = { inCnt: 0, outCnt: 0, rev: 0, profit: 0 }; });

  const byRep = {};
  let totCount = 0, totRev = 0, totComm = 0, totProfit = 0;

  rows.forEach(r => {
    const cnt = Number(r.count) || 0;
    const comm = Number(r.commission) || 0;
    const rate = cnt > 0 ? (comm / cnt) : (repsMap[r.rep] || 27);

    let rowIn = 0, rowOut = 0, rowRev = 0, rowProfit = 0;

    keys.forEach(k => {
      const ic = Number(r.zin && r.zin[k]) || 0;
      const oc = outKeys.includes(k) ? (Number(r.zout && r.zout[k]) || 0) : 0;
      const rev = ic * (inP[k] || 0) + oc * (outP[k] || 0);
      const prof = ic * ((inP[k] || 0) - rate) + oc * ((outP[k] || 0) - rate);

      coStats[k].inCnt += ic;
      coStats[k].outCnt += oc;
      coStats[k].rev += rev;
      coStats[k].profit += prof;

      rowIn += ic;
      rowOut += oc;
      rowRev += rev;
      rowProfit += prof;
    });

    totCount += (rowIn + rowOut);
    totRev += rowRev;
    totComm += comm;
    totProfit += rowProfit;

    if (rowIn + rowOut > 0 || comm > 0) {
      if (!byRep[r.rep]) byRep[r.rep] = { inCnt: 0, outCnt: 0, count: 0, comm: 0, profit: 0 };
      byRep[r.rep].inCnt += rowIn;
      byRep[r.rep].outCnt += rowOut;
      byRep[r.rep].count += (rowIn + rowOut);
      byRep[r.rep].comm += comm;
      byRep[r.rep].profit += rowProfit;
    }
  });

  $('bigProfit').textContent = fmt(totProfit);
  $('stCount').textContent = fmt(totCount);
  $('stRev').textContent = fmt(totRev);
  $('stComm').textContent = fmt(totComm);

  $('coCards').innerHTML = keys.map(k => {
    const s = coStats[k];
    const hasOut = outKeys.includes(k);
    return `<div class="co co-${k}">
      <h3>${esc(names[k] || k)}</h3>
      <div class="sub">داخل: ${s.inCnt}${hasOut ? ` | خارج: ${s.outCnt}` : ''}</div>
      <div class="pv">${fmt(s.profit)}</div>
      <div class="sub">إيراد: ${fmt(s.rev)}</div>
    </div>`;
  }).join('');

  const repNames = Object.keys(byRep);
  if (!repNames.length) {
    $('repBody').innerHTML = '<tr><td colspan="6" class="muted">مفيش شحنات مسجلة في الفترة دي</td></tr>';
  } else {
    let sumIn = 0, sumOut = 0;
    $('repBody').innerHTML = repNames.map(name => {
      const o = byRep[name];
      sumIn += o.inCnt;
      sumOut += o.outCnt;
      const cls = o.profit >= 0 ? 'pos' : 'neg';
      return `<tr>
        <td class="name">${esc(name)}</td>
        <td class="amt">${o.inCnt}</td>
        <td class="amt">${o.outCnt}</td>
        <td class="amt">${o.count}</td>
        <td class="amt">${fmt(o.comm)}</td>
        <td class="amt"><span class="pill ${cls}">${fmt(o.profit)}</span></td>
      </tr>`;
    }).join('') + `
      <tr class="tot">
        <td class="name">الإجمالي</td>
        <td class="amt">${sumIn}</td>
        <td class="amt">${sumOut}</td>
        <td class="amt">${totCount}</td>
        <td class="amt">${fmt(totComm)}</td>
        <td class="amt">${fmt(totProfit)}</td>
      </tr>`;
  }
}

(async function init() {
  const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = dark ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  paintThemeBtn(theme);

  const today = todayISO();
  $('dDate').value = today;
  $('fromDate').value = addDays(today, -6);
  $('toDate').value = today;

  try {
    const [p, days, reps] = await Promise.all([call('getPrices'), call('listDays'), call('getReps')]);
    priceData = p || priceData;
    savedDaysList = days || [];
    (reps || []).forEach(r => { repsMap[r.name] = r.rate; });
    if (savedDaysList.length && !savedDaysList.includes(today)) {
      $('dDate').value = savedDaysList[0];
    }
    renderSavedDays();
  } catch (e) {
    toast(e.message, false);
  }
  loadData();
})();
</script>
</body>
</html>
